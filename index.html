        function renderFavorites(){const sec=document.getElementById('section-favorites');const prods=getAllProducts().filter(p=>appData.favorites.includes(p.id));if(!prods.length){sec.innerHTML='<div class="empty-state"><div class="empty-icon">❤️</div><div class="empty-text">Нет избранных товаров</div></div>';return;}sec.innerHTML=`<div class="products-grid">${prods.map(p=>productCard(p)).join('')}</div>`;}

        // ============================================
        // КОРЗИНА С ПЛАТЕЖАМИ
        // ============================================
        function renderCart(){const sec=document.getElementById('section-cart');const e=Object.entries(appData.cart);let savedHtml='';if(appData.savedCarts.length){savedHtml='<div class="settings-card" style="margin-bottom:12px;"><h3 style="font-size:12px;text-transform:uppercase;color:var(--text-secondary);margin-bottom:8px;">💾 Сохранённые корзины</h3>';appData.savedCarts.forEach((sc,i)=>{savedHtml+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);"><span style="font-size:13px;">Корзина #${i+1} (${Object.values(sc).reduce((s,q)=>s+q,0)} тов.)</span><div><button class="btn btn-outline btn-sm" onclick="loadSavedCart(${i})">📥</button><button class="btn btn-danger btn-sm" onclick="deleteSavedCart(${i})">✕</button></div></div>`;});savedHtml+='</div>';}if(!e.length){sec.innerHTML=savedHtml+'<div class="empty-state"><div class="empty-icon">🛒</div><div class="empty-text">Корзина пуста</div></div>';updateBadge();return;}let t=0,h='';e.forEach(([pid,q])=>{const p=findProduct(+pid);if(!p)return;const s=p.price*q;t+=s;h+=`<div class="cart-item"><div class="cart-item-image">${p.imageUrl?`<img src="${Security.sanitizeURL(p.imageUrl)||p.imageUrl}">`:p.image}</div><div class="cart-item-info"><div class="cart-item-name">${Security.sanitizeHTML(p.name)}</div><div class="cart-item-price">${p.price.toLocaleString()} ${STORE_CONFIG.currency} × ${q} = ${s.toLocaleString()} ${STORE_CONFIG.currency}</div></div><div class="qty-control"><button class="qty-btn" onclick="updateCart(${p.id},-1)">−</button><span>${q}</span><button class="qty-btn" onclick="updateCart(${p.id},1)">+</button></div></div>`;});sec.innerHTML=savedHtml+h+`<div class="cart-total"><span class="total-label">Итого</span><span class="total-price">${t.toLocaleString()} ${STORE_CONFIG.currency}</span></div><button class="btn btn-success" style="margin-top:10px;" onclick="openCheckout()">📝 Оформить заказ</button><button class="btn btn-outline" style="margin-top:6px;" onclick="saveCart()">💾 Сохранить корзину</button><button class="btn btn-outline" style="margin-top:6px;" onclick="clearCart()">Очистить</button>`;updateBadge();}
        function saveCart(){if(!Object.keys(appData.cart).length){toast('Корзина пуста');return;}appData.savedCarts.push({...appData.cart});saveAppData();renderCart();toast('Корзина сохранена');}
        function loadSavedCart(i){appData.cart={...appData.savedCarts[i]};saveAppData();renderCart();toast('Корзина загружена');}
        function deleteSavedCart(i){appData.savedCarts.splice(i,1);saveAppData();renderCart();toast('Сохранённая корзина удалена');}

        function openCheckout(){
            if(!Object.keys(appData.cart).length){toast('Корзина пуста');return;}
            const u=appData.user;
            let total=Object.entries(appData.cart).reduce((s,[pid,q])=>{const p=findProduct(+pid);return s+(p?p.price*q:0);},0);
            
            // Применяем промокод
            let discountText = '';
            if (appliedPromocode && STORE_CONFIG.promocodes[appliedPromocode]) {
                const promo = STORE_CONFIG.promocodes[appliedPromocode];
                if (total >= promo.minOrder) {
                    const discount = promo.type === 'percent' ? total * promo.value / 100 : promo.value;
                    total = Math.max(0, total - discount);
                    discountText = `<p style="color:var(--success);margin-bottom:8px;">🏷️ Промокод ${appliedPromocode}: -${discount.toLocaleString()} ${STORE_CONFIG.currency}</p>`;
                }
            }

            const paymentMethodsHtml = STORE_CONFIG.paymentMethods.map(m => 
                `<option value="${m.id}">${m.icon} ${m.name}</option>`
            ).join('');

            showModal('📝 Оформление заказа', `
                <p style="font-weight:700;font-size:16px;margin-bottom:4px;">Сумма: ${total.toLocaleString()} ${STORE_CONFIG.currency}</p>
                ${discountText}
                <div class="form-group" style="margin-top:12px;">
                    <label class="form-label">Промокод</label>
                    <div style="display:flex;gap:6px;">
                        <input class="form-input" id="promoCode" placeholder="Введите код" value="${appliedPromocode||''}">
                        <button class="btn btn-sm" onclick="applyPromoCode()">Применить</button>
                    </div>
                </div>
                <div class="form-group"><label class="form-label">Имя *</label><input class="form-input" id="coName" value="${Security.sanitizeHTML(u.firstName+' '+u.lastName)}"></div>
                <div class="form-group"><label class="form-label">Телефон *</label><input class="form-input" id="coPhone" value="${Security.sanitizeHTML(u.phone||'')}"></div>
                <div class="form-row"><div class="form-group"><label class="form-label">Страна *</label><input class="form-input" id="coCountry" value="${Security.sanitizeHTML(u.country||'')}"></div><div class="form-group"><label class="form-label">Город *</label><input class="form-input" id="coCity" value="${Security.sanitizeHTML(u.city||'')}"></div></div>
                <div class="form-group"><label class="form-label">Адрес *</label><input class="form-input" id="coAddress" value="${Security.sanitizeHTML(u.address||'')}"></div>
                <div class="form-group"><label class="form-label">Способ оплаты</label><select class="form-input" id="paymentMethod">${paymentMethodsHtml}</select></div>
            `, `<button class="btn btn-outline btn-sm" onclick="closeModal()">Отмена</button><button class="btn btn-success btn-sm" onclick="confirmCheckout(${total})">✅ Оплатить</button>`);
        }

        function applyPromoCode() {
            const code = document.getElementById('promoCode')?.value.trim().toUpperCase();
            if (!code) { toast('Введите промокод'); return; }
            if (STORE_CONFIG.promocodes[code]) {
                const promo = STORE_CONFIG.promocodes[code];
                const total = Object.entries(appData.cart).reduce((s,[pid,q])=>{const p=findProduct(+pid);return s+(p?p.price*q:0);},0);
                if (total < promo.minOrder) {
                    toast(`Минимальная сумма заказа: ${promo.minOrder} ${STORE_CONFIG.currency}`);
                    return;
                }
                appliedPromocode = code;
                toast(`Промокод ${code} применён!`);
                openCheckout();
            } else {
                toast('Промокод не найден');
            }
        }

        function confirmCheckout(total){
            const f=['coName','coPhone','coCountry','coCity','coAddress'],v={};let ok=true;
            f.forEach(id=>{v[id]=document.getElementById(id)?.value.trim();if(!v[id]){document.getElementById(id)?.classList.add('error');ok=false;}});
            if(!ok){toast('Заполните обязательные поля');return;}
            const paymentMethodId = document.getElementById('paymentMethod')?.value || 'card';
            const paymentMethod = STORE_CONFIG.paymentMethods.find(m => m.id === paymentMethodId);

            // Обработка платежа
            showModal('💳 Обработка платежа', '<p style="text-align:center;">Пожалуйста, подождите...</p><div style="text-align:center;font-size:32px;animation: spin 1s linear infinite;">⏳</div>');
            
            const items=Object.entries(appData.cart).map(([pid,q])=>{const p=findProduct(+pid);return{name:p?.name||'Товар',qty:q,price:p?.price||0};});
            const order={id:Date.now().toString().slice(-6),date:new Date().toISOString().slice(0,10),status:'pending',items,total,country:v.coCountry,city:v.coCity,address:v.coAddress,phone:v.coPhone,name:v.coName,paymentMethod:paymentMethodId,promocode:appliedPromocode};

            processPayment(order, paymentMethod).then(result => {
                closeModal();
                if (result.success) {
                    appData.orders.push(order);
                    Database.saveOrder(order);
                    appData.cart={};
                    appliedPromocode = null;
                    if(!appData.user.history)appData.user.history=[];
                    appData.user.history.unshift({action:`Заказ #${order.id} оплачен (${paymentMethod.name})`,date:new Date().toISOString().slice(0,10)});
                    saveAppData();
                    navigateTo('orders');
                    toast(`✅ Заказ #${order.id} оплачен! Спасибо!`);
                } else {
                    toast(`❌ ${result.error}`);
                }
            });
        }

        function addToCart(pid,s){appData.cart[pid]=(appData.cart[pid]||0)+1;saveAppData();updateBadge();const p=findProduct(pid);if(p&&s)flyToCart(p,s);toast('Добавлено в корзину');}
        function updateCart(pid,d){if(appData.cart[pid]){appData.cart[pid]+=d;if(appData.cart[pid]<=0)delete appData.cart[pid];}saveAppData();renderCart();updateBadge();}
        function clearCart(){appData.cart={};appliedPromocode=null;saveAppData();renderCart();toast('Корзина очищена');}
        function updateBadge(){const t=Object.values(appData.cart).reduce((s,q)=>s+q,0);[document.getElementById('cartBadge'),document.getElementById('mobileCartBadge')].forEach(el=>{if(el){el.textContent=t;el.style.display=t>0?'flex':'none';}});}

        // ============================================
        // ЗАКАЗЫ
        // ============================================
        function renderOrders(){const sec=document.getElementById('section-orders');if(!appData.orders.length){sec.innerHTML='<div class="empty-state"><div class="empty-icon">📦</div><div class="empty-text">Нет заказов</div></div>';return;}sec.innerHTML=appData.orders.slice().reverse().map(o=>{const sm=isAdmin()?`<div class="status-menu">${['pending','processing','shipped','delivered'].map(s=>`<button class="status-btn${o.status===s?' active':''}" onclick="changeStatus('${o.id}','${s}')">${{pending:'Принят',processing:'Готовится',shipped:'Отправлен',delivered:'Доставлен'}[s]}</button>`).join('')}<button class="status-btn" onclick="changeStatus('${o.id}','cancelled')" style="color:var(--danger);">Отменить</button></div>`:'';const itemsHtml=o.items?.length?`<div class="order-items-list">${o.items.map(i=>`<div class="order-item-row"><span>${i.imageUrl?`<img src="${Security.sanitizeURL(i.imageUrl)||i.imageUrl}" style="width:20px;height:20px;object-fit:cover;border-radius:4px;"> `:''}${Security.sanitizeHTML(i.name)} ×${i.qty}</span><span>${(i.price*i.qty).toLocaleString()} ${STORE_CONFIG.currency}</span></div>`).join('')}</div>`:'';return`<div class="order-card"><div class="order-header"><span class="order-id">Заказ #${o.id}</span><span class="order-date">${o.date}</span></div><span class="order-status-badge ${o.status==='pending'?'status-pending':o.status==='processing'?'status-processing':o.status==='shipped'?'status-shipped':o.status==='delivered'?'status-delivered':'status-cancelled'}">${{pending:'Принят',processing:'Готовится',shipped:'Отправлен',delivered:'Доставлен',cancelled:'Отменён'}[o.status]||o.status}</span>${o.paymentMethod?`<p style="font-size:10px;color:var(--text-secondary);margin-top:4px;">💳 ${STORE_CONFIG.paymentMethods.find(m=>m.id===o.paymentMethod)?.name||o.paymentMethod}</p>`:''}<div class="order-address">📍 ${[o.country,o.city,o.address].filter(Boolean).join(', ')}</div>${itemsHtml}<div class="order-total">${o.total.toLocaleString()} ${STORE_CONFIG.currency}</div><div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;"><button class="btn btn-outline btn-sm" onclick="repeatOrder('${o.id}')">🔄 Повторить</button><button class="btn btn-outline btn-sm" onclick="downloadReceipt('${o.id}')">🧾 Чек</button><button class="btn btn-outline btn-sm" onclick="openOrderChat('${o.id}')">💬 Чат</button><button class="btn btn-outline btn-sm" onclick="requestReturn('${o.id}')">↩️ Возврат</button></div>${sm}</div>`;}).join('');}
        function changeStatus(oid,s){if(!isAdmin())return;const o=appData.orders.find(x=>x.id===oid);if(!o)return;o.status=s;Database.saveOrder(o);saveAppData();renderOrders();toast(`Заказ #${oid}: ${{pending:'Принят',processing:'Готовится',shipped:'Отправлен',delivered:'Доставлен',cancelled:'Отменён'}[s]}`);}
        function repeatOrder(oid){const o=appData.orders.find(x=>x.id===oid);if(!o)return;o.items.forEach(i=>{const p=getAllProducts().find(x=>x.name===i.name);if(p)appData.cart[p.id]=(appData.cart[p.id]||0)+i.qty;});saveAppData();navigateTo('cart');toast('Товары добавлены в корзину');}
        function downloadReceipt(oid){const o=appData.orders.find(x=>x.id===oid);if(!o)return;let receipt=`Чек #${o.id}\nМагазин: ${STORE_CONFIG.name}\nДата: ${o.date}\nСтатус: ${{pending:'Принят',processing:'Готовится',shipped:'Отправлен',delivered:'Доставлен',cancelled:'Отменён'}[o.status]}\nАдрес: ${[o.country,o.city,o.address].filter(Boolean).join(', ')}\n\n`;o.items?.forEach(i=>{receipt+=`- ${i.name} ×${i.qty} = ${(i.price*i.qty).toLocaleString()} ${STORE_CONFIG.currency}\n`;});receipt+=`\nИтого: ${o.total.toLocaleString()} ${STORE_CONFIG.currency}`;const blob=new Blob([receipt],{type:'text/plain'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`чек_${o.id}.txt`;a.click();URL.revokeObjectURL(url);toast('Чек скачан');}
        function openOrderChat(oid){const o=appData.orders.find(x=>x.id===oid);if(!o)return;if(!o.messages)o.messages=[{text:'Здравствуйте! Заказ принят в обработку.',type:'bot'}];showModal(`💬 Чат по заказу #${oid}`,`<div style="margin-bottom:10px;">${o.messages.map(m=>`<div class="chat-msg ${m.type}">${Security.sanitizeHTML(m.text)}</div>`).join('')}</div><div class="chat-input-row"><input class="chat-input" id="orderChatInput" placeholder="Сообщение..."><button class="btn btn-sm" onclick="sendOrderChat('${oid}')">📤</button></div>`,`<button class="btn btn-outline btn-sm" onclick="closeModal()">Закрыть</button>`);}
        function sendOrderChat(oid){const input=document.getElementById('orderChatInput');const text=input.value.trim();if(!text)return;const o=appData.orders.find(x=>x.id===oid);if(!o)return;if(!o.messages)o.messages=[];o.messages.push({text,type:'user'});saveAppData();setTimeout(()=>{o.messages.push({text:'Спасибо! Мы ответим в ближайшее время.',type:'bot'});saveAppData();openOrderChat(oid);},500);}
        function requestReturn(oid){const o=appData.orders.find(x=>x.id===oid);if(!o)return;showModal('↩️ Запрос возврата',`<p>Вы уверены, что хотите запросить возврат по заказу #${oid}?</p><div class="form-group"><label class="form-label">Причина</label><textarea class="form-textarea" id="returnReason" style="min-height:60px;"></textarea></div>`,`<button class="btn btn-outline btn-sm" onclick="closeModal()">Отмена</button><button class="btn btn-danger btn-sm" onclick="confirmReturn('${oid}')">↩️ Отправить</button>`);}
        function confirmReturn(oid){const o=appData.orders.find(x=>x.id===oid);if(!o)return;o.status='cancelled';o.returnReason=document.getElementById('returnReason')?.value||'Не указана';Database.saveOrder(o);saveAppData();closeModal();renderOrders();toast('Запрос на возврат отправлен');}

        // ============================================
        // НОВОСТИ
        // ============================================
        function renderNews(){const sec=document.getElementById('section-news');const all=getAllNews();const categories=['Все','Акции','События','Советы'];const filtered=appData.newsCategory==='all'?all:all.filter(n=>n.category===appData.newsCategory);sec.innerHTML=`<div class="news-categories">${categories.map(c=>`<div class="news-cat${appData.newsCategory===c||(c==='Все'&&appData.newsCategory==='all')?' active':''}" onclick="setNewsCategory('${c==='Все'?'all':c}')">${c}</div>`).join('')}</div>${filtered.length?filtered.map(n=>{const canEdit=isAdmin()&&appData.customNews.some(x=>x.id===n.id);const reactions=n.reactions||{};return`<div class="news-card" onclick="showNewsDetail(${n.id})">${canEdit?`<div class="news-actions"><button class="product-action-btn" onclick="event.stopPropagation();openEditNews(${n.id})">✎</button><button class="product-action-btn danger" onclick="event.stopPropagation();deleteNews(${n.id})">✕</button></div>`:''}<div class="news-date">${formatDate(n.date)} · ${Security.sanitizeHTML(n.category||'Без категории')}</div><div class="news-title">${Security.sanitizeHTML(n.title)}</div><div class="news-text">${Security.sanitizeHTML(n.text.substring(0,150))}${n.text.length>150?'...':''}</div><div class="reactions">${['👍','🔥','❤️'].map(r=>`<button class="reaction-btn${n.userReaction===r?' active':''}" onclick="event.stopPropagation();reactToNews(${n.id},'${r}')">${r} ${reactions[r]||0}</button>`).join('')}<button class="reaction-btn" onclick="event.stopPropagation();shareNews(${n.id})" style="margin-left:auto;">📤</button></div></div>`;}).join(''):'<div class="empty-state"><div class="empty-icon">📰</div><div class="empty-text">Новостей нет</div></div>'}`;}
        function setNewsCategory(c){appData.newsCategory=c;saveAppData();renderNews();}
        function reactToNews(id,reaction){const all=getAllNews();const n=all.find(x=>x.id===id);if(!n)return;if(!n.reactions)n.reactions={};if(n.userReaction===reaction){n.reactions[reaction]=(n.reactions[reaction]||1)-1;n.userReaction=null;}else{if(n.userReaction&&n.reactions[n.userReaction])n.reactions[n.userReaction]=(n.reactions[n.userReaction]||1)-1;n.reactions[reaction]=(n.reactions[reaction]||0)+1;n.userReaction=reaction;}if(n.reactions[reaction]<=0)delete n.reactions[reaction];if(appData.customNews.some(x=>x.id===id)){const cn=appData.customNews.find(x=>x.id===id);if(cn){cn.reactions=n.reactions;cn.userReaction=n.userReaction;}}saveAppData();renderNews();}
        function shareNews(id){const n=getAllNews().find(x=>x.id===id);if(!n)return;const text=`📰 ${n.title}\n\n${n.text.substring(0,100)}...`;window.open(`https://t.me/share/url?text=${encodeURIComponent(text)}`,'_blank');toast('Открыто в Telegram');}
        function showNewsDetail(id){const n=getAllNews().find(x=>x.id===id);if(!n)return;showModal(Security.sanitizeHTML(n.title),`<p style="color:var(--text-secondary);font-size:10px;text-transform:uppercase;margin-bottom:8px;">${formatDate(n.date)} · ${Security.sanitizeHTML(n.authorName||'Автор')}</p><p style="line-height:1.6;">${Security.sanitizeHTML(n.text)}</p>`,`<button class="btn btn-outline btn-sm" onclick="closeModal()">Закрыть</button><button class="btn btn-sm" onclick="shareNews(${id})">📤 Поделиться</button>`);}
        function openCreateNews(){if(!isAdmin()){toast('Только администратор');return;}showModal('📰 Новая новость',`<div class="form-group"><label class="form-label">Заголовок *</label><input class="form-input" id="newsTitle"></div><div class="form-group"><label class="form-label">Категория</label><select class="form-input" id="newsCategory"><option>Акции</option><option>События</option><option>Советы</option></select></div><div class="form-group"><label class="form-label">Дата</label><input class="form-input" id="newsDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="form-group"><label class="form-label">Текст *</label><textarea class="form-textarea" id="newsText" style="min-height:100px;"></textarea></div>`,`<button class="btn btn-outline btn-sm" onclick="closeModal()">Отмена</button><button class="btn btn-sm" onclick="saveNewNews()">💾 Опубликовать</button>`);}
        function saveNewNews(){const t=document.getElementById('newsTitle')?.value.trim();const x=document.getElementById('newsText')?.value.trim();if(!t||!x){toast('Заполните заголовок и текст');return;}const news={id:genId(getAllNews()),title:t,category:document.getElementById('newsCategory')?.value||'Акции',date:document.getElementById('newsDate')?.value||new Date().toISOString().slice(0,10),text:x,authorId:appData.user.id,authorName:`${appData.user.firstName} ${appData.user.lastName}`,reactions:{},userReaction:null};appData.customNews.push(news);Database.saveNews(news);saveAppData();closeModal();navigateTo('news');toast('📰 Новость опубликована!');}
        function openEditNews(id){const n=appData.customNews.find(x=>x.id===id);if(!n)return;showModal('✎ Редактировать',`<div class="form-group"><label class="form-label">Заголовок</label><input class="form-input" id="newsTitle" value="${Security.sanitizeHTML(n.title)}"></div><div class="form-group"><label class="form-label">Категория</label><select class="form-input" id="newsCategory"><option ${n.category==='Акции'?'selected':''}>Акции</option><option ${n.category==='События'?'selected':''}>События</option><option ${n.category==='Советы'?'selected':''}>Советы</option></select></div><div class="form-group"><label class="form-label">Дата</label><input class="form-input" id="newsDate" type="date" value="${n.date}"></div><div class="form-group"><label class="form-label">Текст</label><textarea class="form-textarea" id="newsText" style="min-height:100px;">${Security.sanitizeHTML(n.text)}</textarea></div>`,`<button class="btn btn-outline btn-sm" onclick="closeModal()">Отмена</button><button class="btn btn-sm" onclick="saveEditNews(${id})">💾 Сохранить</button>`);}
        function saveEditNews(id){const n=appData.customNews.find(x=>x.id===id);if(!n)return;n.title=document.getElementById('newsTitle')?.value.trim()||n.title;n.category=document.getElementById('newsCategory')?.value||n.category;n.date=document.getElementById('newsDate')?.value||n.date;n.text=document.getElementById('newsText')?.value.trim()||n.text;Database.saveNews(n);saveAppData();closeModal();navigateTo('news');toast('✅ Новость обновлена');}
        function deleteNews(id){const n=appData.customNews.find(x=>x.id===id);if(!n)return;showModal('🗑 Удалить?',`<p>Удалить <strong>${Security.sanitizeHTML(n.title)}</strong>?</p>`,`<button class="btn btn-outline btn-sm" onclick="closeModal()">Отмена</button><button class="btn btn-danger btn-sm" onclick="confirmDeleteNews(${id})">🗑 Удалить</button>`);}
        function confirmDeleteNews(id){appData.customNews=appData.customNews.filter(n=>n.id!==id);Database.deleteNews(id);saveAppData();closeModal();navigateTo('news');toast('🗑 Новость удалена');}

        // ============================================
        // НАСТРОЙКИ
        // ============================================
        function renderSettings(){const ct=appData.settings.theme||'auto';const lang=appData.settings.language||'ru';const fs=appData.settings.fontSize||'medium';let rm='';if(isOwner()){rm=`<div class="settings-card"><h3 style="font-size:12px;text-transform:uppercase;color:var(--text-secondary);margin-bottom:10px;">👥 Управление ролями</h3>${appData.users.filter(u=>u.id!==STORE_CONFIG.ownerId).map(u=>`<div class="user-list-item"><div><div class="user-list-name">${Security.sanitizeHTML(u.name)}</div><div class="user-list-role">@${Security.sanitizeHTML(u.username)} · ${u.role==='moderator'?'Модератор':'Пользователь'}</div></div><select class="role-select" onchange="changeUserRole(${u.id},this.value)"><option value="user" ${u.role==='user'?'selected':''}>Пользователь</option><option value="moderator" ${u.role==='moderator'?'selected':''}>Модератор</option></select></div>`).join('')}</div>`;}document.getElementById('section-settings').innerHTML=`${rm}<div class="settings-card"><h3 style="font-size:12px;text-transform:uppercase;color:var(--text-secondary);margin-bottom:8px;">Оформление</h3><div class="theme-options"><button class="theme-option${ct==='light'?' active':''}" onclick="changeTheme('light')">☀️ Светлая</button><button class="theme-option${ct==='dark'?' active':''}" onclick="changeTheme('dark')">🌙 Тёмная</button><button class="theme-option${ct==='auto'?' active':''}" onclick="changeTheme('auto')">🔄 Авто</button></div></div><div class="settings-card"><div class="settings-row"><span class="settings-label">Язык</span><select class="role-select" onchange="changeLanguage(this.value)"><option value="ru" ${lang==='ru'?'selected':''}>Русский</option><option value="en" ${lang==='en'?'selected':''}>English</option></select></div></div><div class="settings-card"><div class="settings-row"><span class="settings-label">Размер шрифта</span><select class="role-select" onchange="changeFontSize(this.value)"><option value="small" ${fs==='small'?'selected':''}>Мелкий</option><option value="medium" ${fs==='medium'?'selected':''}>Средний</option><option value="large" ${fs==='large'?'selected':''}>Крупный</option></select></div></div><div class="settings-card"><div class="settings-row"><span class="settings-label">Уведомления</span><label class="toggle"><input type="checkbox" ${appData.settings.notifications!==false?'checked':''} onchange="toggleNotif(this.checked)"><span class="toggle-slider"></span></label></div></div><div class="settings-card"><h3 style="font-size:12px;text-transform:uppercase;color:var(--text-secondary);margin-bottom:8px;">О приложении</h3><p style="font-size:12px;color:var(--text-secondary);">${STORE_CONFIG.name} v2.0</p><p style="font-size:11px;color:var(--text-secondary);">Безопасный Telegram Web App</p></div><button class="btn btn-outline" onclick="openProfileEditor()">✎ Профиль</button>`;}
        function changeLanguage(l){appData.settings.language=l;saveAppData();renderSettings();toast('Язык: '+(l==='ru'?'Русский':'English'));}
        function changeFontSize(s){applyFontSize(s);renderSettings();toast('Размер шрифта изменён');}
        function changeTheme(t){applyTheme(t);renderSettings();toast('Тема: '+(t==='light'?'светлая':t==='dark'?'тёмная':'авто'));}
        function toggleNotif(v){appData.settings.notifications=v;saveAppData();}
        function changeUserRole(uid,r){if(!isOwner())return;const u=appData.users.find(x=>x.id===uid);if(u){u.role=r;saveAppData();renderSettings();toast(`Роль изменена на ${r==='moderator'?'Модератор':'Пользователь'}`);}}

        // ============================================
        // УТИЛИТЫ
        // ============================================
        function handleSearch(){searchQuery=document.getElementById('searchInput')?.value.trim()||'';if(currentTab==='catalog')renderCatalog();}
        function showModal(t,c,a){document.getElementById('modalTitle').innerHTML=t;document.getElementById('modalText').innerHTML=c;document.getElementById('modalActions').innerHTML=a||'<button class="btn btn-sm" onclick="closeModal()">Закрыть</button>';document.getElementById('modalOverlay').classList.add('active');}
        function closeModal(e){if(e&&e.target!==document.getElementById('modalOverlay'))return;document.getElementById('modalOverlay').classList.remove('active');tempImage=null;document.querySelectorAll('.error').forEach(el=>el.classList.remove('error'));}
        function formatDate(d){const m=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];const dt=new Date(d);return`${dt.getDate()} ${m[dt.getMonth()]} ${dt.getFullYear()}`;}

        // ============================================
        // ИНИЦИАЛИЗАЦИЯ
        // ============================================
        function initApp(){
            initTheme();
            if(window.Telegram?.WebApp){const tg=window.Telegram.WebApp;tg.ready();tg.expand();if(tg.initDataUnsafe?.user){const u=tg.initDataUnsafe.user;appData.user={...appData.user,id:u.id,firstName:u.first_name,lastName:u.last_name||'',username:u.username||`user_${u.id}`,email:`${u.username||'user'}@telegram.user`,photoUrl:u.photo_url||appData.user.photoUrl,role:appData.user.role||(u.id===STORE_CONFIG.ownerId?'owner':'user')};saveAppData();}}
            renderProfile();updateBadge();
            document.getElementById('fabAdd').classList.add('visible');
        }

        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
