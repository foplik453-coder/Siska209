<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Crypto Tracker</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #fff;
            color: #000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh;
            padding-bottom: 80px;
        }
        .header {
            background: #000;
            color: #fff;
            padding: 15px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 10;
            border-bottom: 3px solid #000;
        }
        .header h1 { font-size: 22px; font-weight: 800; letter-spacing: 2px; }
        .header p { font-size: 10px; color: #ccc; letter-spacing: 3px; }

        .nav {
            display: flex;
            gap: 4px;
            padding: 8px;
            background: #f5f5f5;
            position: sticky;
            top: 70px;
            z-index: 9;
            overflow-x: auto;
            border-bottom: 1px solid #ddd;
            scrollbar-width: none;
        }
        .nav::-webkit-scrollbar { display: none; }
        .nav button {
            padding: 8px 14px;
            border: 2px solid #ccc;
            background: #fff;
            color: #666;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            border-radius: 20px;
            transition: all 0.2s;
        }
        .nav button.active {
            border-color: #000;
            background: #000;
            color: #fff;
            font-weight: 700;
        }
        .nav-badge {
            background: #fff;
            color: #000;
            padding: 1px 6px;
            border-radius: 10px;
            font-size: 10px;
            margin-left: 3px;
        }
        .nav button.active .nav-badge {
            background: #fff;
            color: #000;
        }

        .container { padding: 10px; max-width: 500px; margin: 0 auto; }
        .tab { display: none; animation: fadeIn 0.2s ease; }
        .tab.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .search {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #ddd;
            border-radius: 12px;
            font-size: 13px;
            outline: none;
            margin: 8px 0;
            background: #fff;
            color: #000;
        }
        .search:focus { border-color: #000; }

        .section-title {
            font-size: 13px;
            font-weight: 700;
            margin: 16px 0 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .coin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

        .coin-card {
            background: #fff;
            border: 2px solid #e0e0e0;
            border-radius: 14px;
            padding: 12px;
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
        }
        .coin-card:active { border-color: #000; transform: scale(0.97); }
        .coin-sym { font-size: 14px; font-weight: 700; color: #000; }
        .coin-rank { font-size: 9px; color: #999; background: #f0f0f0; padding: 2px 6px; border-radius: 4px; margin-left: 4px; }
        .coin-star { position: absolute; top: 10px; right: 10px; font-size: 16px; cursor: pointer; z-index: 2; }
        .coin-price { font-size: 16px; font-weight: 700; margin: 4px 0; color: #000; }
        .coin-change { font-size: 11px; font-weight: 600; }
        .up { color: #00aa00; }
        .down { color: #cc0000; }
        .coin-vol { font-size: 9px; color: #999; margin-top: 2px; }
        .pop-bar { height: 3px; background: #eee; border-radius: 2px; margin-top: 6px; overflow: hidden; }
        .pop-fill { height: 100%; background: #000; border-radius: 2px; transition: width 0.5s ease; }

        .btn {
            width: 100%;
            padding: 12px;
            border: 2px solid #000;
            background: #fff;
            color: #000;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            margin: 5px 0;
            border-radius: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s;
        }
        .btn:active { background: #000; color: #fff; }
        .btn-black { background: #000; color: #fff; }
        .btn-black:active { background: #333; }

        .pf-summary {
            background: #fff;
            border: 2px solid #000;
            border-radius: 16px;
            padding: 16px;
            text-align: center;
            margin-bottom: 12px;
        }
        .pf-label { font-size: 10px; color: #666; letter-spacing: 2px; }
        .pf-value { font-size: 32px; font-weight: 800; color: #000; margin: 6px 0; }

        .pf-item, .alert-item {
            background: #fff;
            border: 2px solid #e0e0e0;
            border-radius: 14px;
            padding: 12px;
            margin-bottom: 6px;
            transition: 0.2s;
        }
        .pf-item:hover, .alert-item:hover { border-color: #000; }

        .profile-card {
            background: #fff;
            border: 2px solid #000;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            margin-bottom: 12px;
        }
        .profile-avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: #000;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            margin: 0 auto 10px;
        }
        .profile-name { font-size: 18px; font-weight: 700; }
        .profile-username { color: #666; font-size: 13px; }
        .profile-id { font-size: 10px; color: #999; }

        .stat-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
        .stat-item {
            background: #fff;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 12px;
            text-align: center;
        }
        .stat-value { font-size: 20px; font-weight: 700; color: #000; }
        .stat-label { font-size: 8px; color: #999; text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.98);
            z-index: 100;
            padding: 20px;
        }
        .modal.active { display: flex; align-items: center; justify-content: center; }
        .modal-box {
            background: #fff;
            border: 3px solid #000;
            border-radius: 20px;
            padding: 16px;
            width: 100%;
            max-width: 340px;
        }
        .modal-close {
            float: right;
            background: #000;
            color: #fff;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 14px;
        }
        .modal-sym { font-size: 20px; font-weight: 800; }
        .modal-price { font-size: 34px; font-weight: 800; margin: 8px 0; color: #000; }
        .modal-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin: 10px 0; }
        .modal-stat {
            background: #f5f5f5;
            border-radius: 10px;
            padding: 8px;
            text-align: center;
        }
        .modal-stat-label { font-size: 8px; color: #999; text-transform: uppercase; }
        .modal-stat-value { font-size: 13px; font-weight: 700; }

        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: #000;
            color: #fff;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            z-index: 200;
            display: none;
            white-space: nowrap;
        }
        .toast.show { display: block; }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #fff;
            display: flex;
            border-top: 2px solid #e0e0e0;
            z-index: 10;
            padding: 4px;
        }
        .bottom-nav button {
            flex: 1;
            padding: 8px;
            border: none;
            background: none;
            color: #999;
            font-size: 8px;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .bottom-nav button.active { color: #000; }
        .bottom-nav button span { font-size: 18px; display: block; margin-bottom: 2px; }

        .empty { text-align: center; padding: 30px; color: #999; }
        .empty-icon { font-size: 40px; margin-bottom: 8px; }

        @media (max-width: 380px) {
            .coin-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>CRYPTO TRACKER</h1>
        <p>REAL-TIME PRICES</p>
    </div>

    <div class="nav" id="nav">
        <button class="active" data-tab="prices">💰 Prices</button>
        <button data-tab="portfolio">💼 Portfolio <span class="nav-badge" id="badgePF">0</span></button>
        <button data-tab="favorites">⭐ Favorites <span class="nav-badge" id="badgeFav">0</span></button>
        <button data-tab="alerts">🔔 Alerts <span class="nav-badge" id="badgeAlerts">0</span></button>
        <button data-tab="profile">👤 Profile</button>
    </div>

    <div class="container">
        <!-- PRICES -->
        <div class="tab active" id="tab-prices">
            <input type="text" class="search" id="searchInput" placeholder="Search coin (BTC, ETH, SOL)..." oninput="updatePrices()">
            <div class="section-title">▲ Top Gainers</div>
            <div class="coin-grid" id="gainersGrid"></div>
            <div class="section-title">▼ Top Losers</div>
            <div class="coin-grid" id="losersGrid"></div>
            <div class="section-title">◆ All Coins</div>
            <div class="coin-grid" id="popularGrid"></div>
        </div>

        <!-- PORTFOLIO -->
        <div class="tab" id="tab-portfolio">
            <div class="pf-summary">
                <div class="pf-label">Total Value</div>
                <div class="pf-value" id="pfValue">$0.00</div>
                <div id="pfPnl" style="font-size:13px;font-weight:600;">Add coins to start</div>
            </div>
            <div id="pfList"></div>
            <button class="btn btn-black" onclick="addToPortfolio()">+ Add Coin</button>
            <button class="btn" onclick="clearPortfolio()">Clear All</button>
        </div>

        <!-- FAVORITES -->
        <div class="tab" id="tab-favorites">
            <div class="coin-grid" id="favGrid"></div>
        </div>

        <!-- ALERTS -->
        <div class="tab" id="tab-alerts">
            <div id="alertList"></div>
            <button class="btn btn-black" onclick="addAlert()">+ New Alert</button>
        </div>

        <!-- PROFILE -->
        <div class="tab" id="tab-profile">
            <div class="profile-card">
                <div class="profile-avatar">👤</div>
                <div class="profile-name" id="profName">User</div>
                <div class="profile-username" id="profUsername">@username</div>
                <div class="profile-id" id="profId">ID: ---</div>
            </div>
            <div class="stat-grid">
                <div class="stat-item"><div class="stat-value" id="statPF">0</div><div class="stat-label">Assets</div></div>
                <div class="stat-item"><div class="stat-value" id="statFav">0</div><div class="stat-label">Favorites</div></div>
                <div class="stat-item"><div class="stat-value" id="statAlert">0</div><div class="stat-label">Alerts</div></div>
            </div>
            <div class="stat-grid" style="margin-top:8px;">
                <div class="stat-item"><div class="stat-value" id="statInv">$0</div><div class="stat-label">Invested</div></div>
                <div class="stat-item"><div class="stat-value" id="statCur">$0</div><div class="stat-label">Current</div></div>
                <div class="stat-item"><div class="stat-value" id="statPnl">$0</div><div class="stat-label">Total P/L</div></div>
            </div>
            <button class="btn" onclick="resetAll()" style="margin-top:10px;">Reset All Data</button>
        </div>
    </div>

    <!-- MODAL -->
    <div class="modal" id="coinModal">
        <div class="modal-box">
            <button class="modal-close" onclick="closeModal()">✕</button>
            <div class="modal-sym" id="modSym">BTC</div>
            <div class="modal-price" id="modPrice">$0.00</div>
            <div class="modal-stats">
                <div class="modal-stat"><div class="modal-stat-label">24h Change</div><div class="modal-stat-value" id="modChange">0%</div></div>
                <div class="modal-stat"><div class="modal-stat-label">High</div><div class="modal-stat-value" id="modHigh">$0</div></div>
                <div class="modal-stat"><div class="modal-stat-label">Low</div><div class="modal-stat-value" id="modLow">$0</div></div>
                <div class="modal-stat"><div class="modal-stat-label">Volume</div><div class="modal-stat-value" id="modVolume">$0</div></div>
            </div>
            <button class="btn btn-black" id="modFavBtn" onclick="toggleFavModal()">⭐ Favorite</button>
            <button class="btn" onclick="addPfFromModal()">+ Portfolio</button>
            <button class="btn" onclick="addAlertFromModal()">+ Alert</button>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <div class="bottom-nav" id="bottomNav">
        <button class="active" data-tab="prices"><span>💰</span>Prices</button>
        <button data-tab="portfolio"><span>💼</span>Portfolio</button>
        <button data-tab="favorites"><span>⭐</span>Favorites</button>
        <button data-tab="alerts"><span>🔔</span>Alerts</button>
        <button data-tab="profile"><span>👤</span>Profile</button>
    </div>

    <script>
        let allCoins = [];
        let favorites = JSON.parse(localStorage.getItem('ct_fav') || '[]');
        let portfolio = JSON.parse(localStorage.getItem('ct_pf') || '[]');
        let alerts = JSON.parse(localStorage.getItem('ct_alerts') || '[]');
        let currentCoin = 'BTC';

        // Загружаем ТОЛЬКО USDT пары (никаких китайских символов)
        async function loadData() {
            try {
                let r = await fetch('https://api.binance.com/api/v3/ticker/24hr');
                let d = await r.json();
                allCoins = d
                    .filter(i => i.symbol.endsWith('USDT'))
                    .filter(i => {
                        let sym = i.symbol.replace('USDT', '');
                        // Исключаем всякие UP/DOWN/BULL/BEAR токены и странные символы
                        return !sym.includes('UP') && !sym.includes('DOWN') && 
                               !sym.includes('BULL') && !sym.includes('BEAR') &&
                               /^[A-Z0-9]+$/.test(sym) && sym.length <= 6;
                    })
                    .map(i => ({
                        s: i.symbol.replace('USDT', ''),
                        p: parseFloat(i.lastPrice),
                        c: parseFloat(i.priceChangePercent),
                        h: parseFloat(i.highPrice),
                        l: parseFloat(i.lowPrice),
                        v: parseFloat(i.volume),
                        q: parseFloat(i.quoteVolume)
                    }))
                    .filter(c => c.p > 0.0001 && c.q > 100000);
                
                allCoins.sort((a,b) => b.q - a.q);
                allCoins.forEach((c,i) => c.rank = i + 1);
                
                updateAll();
            } catch(e) { console.error(e); }
        }

        function fmt(p) {
            if (!p) return '0';
            if (p < 0.001) return p.toFixed(6);
            if (p < 1) return p.toFixed(4);
            if (p < 100) return p.toFixed(2);
            return p.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
        }

        function fmtV(v) {
            if (v > 1e9) return '$' + (v/1e9).toFixed(1) + 'B';
            if (v > 1e6) return '$' + (v/1e6).toFixed(0) + 'M';
            return '$' + (v/1e3).toFixed(0) + 'K';
        }

        function updateAll() {
            updatePrices();
            updatePortfolio();
            updateFavorites();
            updateAlerts();
            updateProfile();
            updateBadges();
        }

        function coinCard(c) {
            let fav = favorites.includes(c.s);
            let pop = Math.min(100, Math.round((c.q / (allCoins[0]?.q || 1)) * 100));
            return `<div class="coin-card" onclick="openModal('${c.s}')">
                <span class="coin-star" onclick="event.stopPropagation();toggleFav('${c.s}')">${fav?'⭐':'☆'}</span>
                <div><span class="coin-sym">${c.s}</span><span class="coin-rank">#${c.rank}</span></div>
                <div class="coin-price">$${fmt(c.p)}</div>
                <div class="coin-change ${c.c>=0?'up':'down'}">${c.c>=0?'▲ +':'▼ '}${c.c.toFixed(2)}%</div>
                <div class="coin-vol">Vol: ${fmtV(c.q)}</div>
                <div class="pop-bar"><div class="pop-fill" style="width:${pop}%"></div></div>
            </div>`;
        }

        function updatePrices() {
            let q = document.getElementById('searchInput')?.value || '';
            let coins = q ? allCoins.filter(c => c.s.toLowerCase().includes(q.toLowerCase())) : allCoins;
            document.getElementById('gainersGrid').innerHTML = [...coins].sort((a,b)=>b.c-a.c).slice(0,6).map(coinCard).join('');
            document.getElementById('losersGrid').innerHTML = [...coins].sort((a,b)=>a.c-b.c).slice(0,6).map(coinCard).join('');
            document.getElementById('popularGrid').innerHTML = [...coins].slice(0,40).map(coinCard).join('');
        }

        function updatePortfolio() {
            let list = document.getElementById('pfList'), val = document.getElementById('pfValue'), pnl = document.getElementById('pfPnl');
            if (portfolio.length === 0) {
                list.innerHTML = '<div class="empty"><div class="empty-icon">💼</div><p>Portfolio empty</p></div>';
                val.textContent = '$0.00';
                pnl.innerHTML = '<span style="color:#999;">Add coins to start</span>';
                return;
            }
            let ti = 0, tc = 0;
            list.innerHTML = portfolio.map((item,i) => {
                let coin = allCoins.find(c => c.s === item.symbol);
                let cp = coin ? coin.p : 0, ch = coin ? coin.c : 0;
                let inv = item.amount * item.buyPrice, cur = item.amount * cp, p = cur - inv, pp = inv > 0 ? (p/inv)*100 : 0;
                ti += inv; tc += cur;
                return `<div class="pf-item">
                    <div style="display:flex;justify-content:space-between;">
                        <strong>${item.symbol}</strong>
                        <span style="color:#cc0000;cursor:pointer;" onclick="removePf(${i})">✕</span>
                    </div>
                    <div style="font-size:10px;color:#999;">${item.amount} units × $${fmt(item.buyPrice)}</div>
                    <div style="font-size:10px;">Now: $${fmt(cp)} | 24h: <span class="${ch>=0?'up':'down'}">${ch>=0?'+':''}${ch.toFixed(2)}%</span></div>
                    <div style="font-weight:700;color:${p>=0?'#00aa00':'#cc0000'};">P/L: $${p.toFixed(2)} (${pp.toFixed(2)}%)</div>
                </div>`;
            }).join('');
            let tp = tc - ti;
            val.textContent = '$' + fmt(tc);
            pnl.innerHTML = `<span style="color:${tp>=0?'#00aa00':'#cc0000'};">P/L: $${tp.toFixed(2)} (${ti>0?(tp/ti*100).toFixed(2):0}%)</span>`;
        }

        function updateFavorites() {
            let favs = allCoins.filter(c => favorites.includes(c.s));
            document.getElementById('favGrid').innerHTML = favs.length > 0 ? favs.map(coinCard).join('') : '<div class="empty" style="grid-column:1/-1;"><div class="empty-icon">⭐</div><p>No favorites</p></div>';
        }

        function updateAlerts() {
            let list = document.getElementById('alertList');
            if (alerts.length === 0) {
                list.innerHTML = '<div class="empty"><div class="empty-icon">🔔</div><p>No alerts</p></div>';
                return;
            }
            list.innerHTML = alerts.map((a,i) => {
                let coin = allCoins.find(c => c.s === a.symbol);
                return `<div class="alert-item" style="display:flex;justify-content:space-between;align-items:center;">
                    <div><strong>${a.symbol}</strong> <span style="color:${a.dir==='above'?'#00aa00':'#cc0000'};font-size:10px;">${a.dir==='above'?'▲ Above':'▼ Below'} $${fmt(a.price)}</span>
                    <div style="font-size:9px;color:#999;">Current: ${coin?'$'+fmt(coin.p):'?'}</div></div>
                    <span style="color:#cc0000;cursor:pointer;" onclick="removeAlert(${i})">✕</span>
                </div>`;
            }).join('');
        }

        function updateProfile() {
            let u = (window.Telegram?.WebApp?.initDataUnsafe?.user) || {};
            document.getElementById('profName').textContent = u.first_name || 'User';
            document.getElementById('profUsername').textContent = u.username ? '@'+u.username : 'Anonymous';
            document.getElementById('profId').textContent = 'ID: ' + (u.id || '---');
            document.getElementById('statPF').textContent = portfolio.length;
            document.getElementById('statFav').textContent = favorites.length;
            document.getElementById('statAlert').textContent = alerts.length;
            let ti = 0, tc = 0;
            portfolio.forEach(item => {
                let coin = allCoins.find(c => c.s === item.symbol);
                ti += item.amount * item.buyPrice;
                tc += item.amount * (coin ? coin.p : 0);
            });
            document.getElementById('statInv').textContent = '$' + fmt(ti);
            document.getElementById('statCur').textContent = '$' + fmt(tc);
            let tp = tc - ti;
            document.getElementById('statPnl').textContent = (tp>=0?'+':'') + '$' + fmt(Math.abs(tp));
            document.getElementById('statPnl').style.color = tp>=0?'#00aa00':'#cc0000';
        }

        function updateBadges() {
            document.getElementById('badgePF').textContent = portfolio.length;
            document.getElementById('badgeFav').textContent = favorites.length;
            document.getElementById('badgeAlerts').textContent = alerts.length;
        }

        // НАВИГАЦИЯ
        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById('tab-' + tabName).classList.add('active');
            document.querySelectorAll('#nav button, #bottomNav button').forEach(b => b.classList.remove('active'));
            document.querySelectorAll(`[data-tab="${tabName}"]`).forEach(b => b.classList.add('active'));
        }

        document.querySelectorAll('#nav button, #bottomNav button').forEach(btn => {
            btn.addEventListener('click', function() {
                switchTab(this.dataset.tab);
            });
        });

        // МОДАЛКА
        function openModal(sym) {
            currentCoin = sym;
            let c = allCoins.find(x => x.s === sym);
            if (!c) return;
            document.getElementById('modSym').textContent = c.s + ' #' + c.rank;
            document.getElementById('modPrice').textContent = '$' + fmt(c.p);
            document.getElementById('modChange').textContent = (c.c>=0?'+':'') + c.c.toFixed(2) + '%';
            document.getElementById('modChange').style.color = c.c>=0?'#00aa00':'#cc0000';
            document.getElementById('modHigh').textContent = '$' + fmt(c.h);
            document.getElementById('modLow').textContent = '$' + fmt(c.l);
            document.getElementById('modVolume').textContent = fmtV(c.q);
            document.getElementById('modFavBtn').textContent = favorites.includes(sym) ? '⭐ Unfavorite' : '☆ Favorite';
            document.getElementById('coinModal').classList.add('active');
        }

        function closeModal() { document.getElementById('coinModal').classList.remove('active'); }

        function toggleFav(sym) {
            let i = favorites.indexOf(sym);
            if (i >= 0) { favorites.splice(i,1); toast('Removed from favorites'); }
            else { favorites.push(sym); toast('Added to favorites'); }
            localStorage.setItem('ct_fav', JSON.stringify(favorites));
            updateAll();
        }

        function toggleFavModal() { toggleFav(currentCoin); }

        function addToPortfolio() {
            let s = prompt('Coin symbol (BTC, ETH...):');
            if (!s) return;
            let a = prompt('Amount:');
            if (!a || isNaN(a)) return;
            let p = prompt('Buy price in USD:');
            if (!p || isNaN(p)) return;
            portfolio.push({symbol:s.toUpperCase(), amount:parseFloat(a), buyPrice:parseFloat(p)});
            localStorage.setItem('ct_pf', JSON.stringify(portfolio));
            updateAll(); switchTab('portfolio'); toast('Added to portfolio!');
        }

        function addPfFromModal() {
            let a = prompt('Amount ' + currentCoin + ':','1');
            if (!a || isNaN(a)) return;
            let c = allCoins.find(x => x.s === currentCoin);
            let p = prompt('Buy price USD:', c ? fmt(c.p) : '');
            if (!p || isNaN(p)) return;
            portfolio.push({symbol:currentCoin, amount:parseFloat(a), buyPrice:parseFloat(p)});
            localStorage.setItem('ct_pf', JSON.stringify(portfolio));
            updateAll(); closeModal(); toast('Added!');
        }

        function removePf(i) { portfolio.splice(i,1); localStorage.setItem('ct_pf', JSON.stringify(portfolio)); updateAll(); toast('Removed'); }
        function clearPortfolio() {
            if (portfolio.length === 0) return;
            if (confirm('Delete all portfolio items?')) { portfolio = []; localStorage.setItem('ct_pf', JSON.stringify(portfolio)); updateAll(); toast('Cleared'); }
        }

        function addAlert() {
            let s = prompt('Coin symbol:');
            if (!s) return;
            let d = confirm('Alert when price goes ABOVE?\nOK = Above\nCancel = Below') ? 'above' : 'below';
            let p = prompt('Target price USD:');
            if (!p || isNaN(p)) return;
            alerts.push({symbol:s.toUpperCase(), dir:d, price:parseFloat(p)});
            localStorage.setItem('ct_alerts', JSON.stringify(alerts));
            updateAll(); toast('Alert created!');
        }

        function addAlertFromModal() {
            let d = confirm('Alert when price goes ABOVE?\nOK = Above\nCancel = Below') ? 'above' : 'below';
            let c = allCoins.find(x => x.s === currentCoin);
            let p = prompt('Target price USD:', c ? fmt(c.p) : '');
            if (!p || isNaN(p)) return;
            alerts.push({symbol:currentCoin, dir:d, price:parseFloat(p)});
            localStorage.setItem('ct_alerts', JSON.stringify(alerts));
            updateAll(); closeModal(); toast('Alert created!');
        }

        function removeAlert(i) { alerts.splice(i,1); localStorage.setItem('ct_alerts', JSON.stringify(alerts)); updateAll(); toast('Alert removed'); }
        function resetAll() {
            if (confirm('Delete ALL data?')) { portfolio = []; favorites = []; alerts = []; localStorage.clear(); updateAll(); toast('All data reset'); }
        }

        function toast(msg) {
            let t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(window._tt);
            window._tt = setTimeout(() => t.classList.remove('show'), 2000);
        }

        // Проверка алертов
        setInterval(() => {
            alerts.forEach((a,i) => {
                let c = allCoins.find(x => x.s === a.symbol);
                if (!c) return;
                if ((a.dir === 'above' && c.p >= a.price) || (a.dir === 'below' && c.p <= a.price)) {
                    alerts.splice(i,1);
                    localStorage.setItem('ct_alerts', JSON.stringify(alerts));
                    updateAll();
                    alert('🚨 ALERT! ' + a.symbol + ' = $' + fmt(c.p) + '\n' + (a.dir==='above'?'Above':'Below') + ' $' + fmt(a.price));
                }
            });
        }, 15000);

        loadData();
        setInterval(loadData, 30000);
    </script>
</body>
