<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Tracker Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0a; --card-bg: #141414; --text: #ffffff;
            --text-secondary: #a0a0a0; --accent: #00d4ff;
            --green: #00ff88; --red: #ff4757; --gold: #ffc048;
            --shadow: 0 4px 20px rgba(0,0,0,0.6);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg); color: var(--text);
            font-family: 'Inter', sans-serif; padding-bottom: 70px;
            font-size: 14px; -webkit-font-smoothing: antialiased;
        }
        .header {
            background: rgba(10,10,10,0.9); backdrop-filter: blur(20px);
            padding: 12px 16px; position: sticky; top: 0; z-index: 100;
            display: flex; align-items: center; gap: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .header h1 { font-size: 16px; font-weight: 700; }
        .ws-status {
            padding: 4px 10px; border-radius: 10px; font-size: 9px;
            background: rgba(0,255,136,0.15); color: var(--green);
            border: 1px solid var(--green); margin-left: auto;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .nav {
            display: flex; gap: 4px; padding: 8px 12px;
            background: rgba(10,10,10,0.8); position: sticky; top: 56px;
            overflow-x: auto; border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .nav button {
            padding: 6px 14px; border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.03); color: #a0a0a0;
            border-radius: 16px; cursor: pointer; white-space: nowrap;
            font-size: 11px; transition: 0.2s;
        }
        .nav button.active {
            background: rgba(0,212,255,0.2); border-color: #00d4ff; color: #00d4ff;
        }
        .container { padding: 12px; max-width: 520px; margin: 0 auto; }
        .tab { display: none; }
        .tab.active { display: block; }
        .coin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        .coin-card {
            background: var(--card-bg); border: 1px solid rgba(255,255,255,0.04);
            border-radius: 14px; padding: 12px; cursor: pointer;
            transition: 0.2s;
        }
        .coin-card:hover { border-color: var(--accent); }
        .coin-price { font-size: 15px; font-weight: 700; }
        .up { color: var(--green); } .down { color: var(--red); }
        .btn {
            width: 100%; padding: 10px; background: rgba(0,212,255,0.1);
            color: var(--accent); border: 1px solid var(--accent);
            border-radius: 12px; cursor: pointer; font-weight: 600;
            margin: 4px 0; font-size: 12px; transition: 0.2s;
        }
        .btn-filled { background: var(--accent); color: #000; border: none; }
        .btn-danger { border-color: var(--red); color: var(--red); background: rgba(255,71,87,0.1); }
        .modal {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8); z-index: 200;
            align-items: center; justify-content: center;
        }
        .modal.show { display: flex; }
        .modal-box {
            background: #111; border-radius: 16px; padding: 16px;
            max-width: 360px; width: 90%;
        }
        .toast {
            position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
            background: #1a1a1a; color: #fff; padding: 10px 20px;
            border-radius: 20px; z-index: 300; display: none;
        }
        .toast.show { display: block; }
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: rgba(10,10,10,0.9); display: flex;
            border-top: 1px solid rgba(255,255,255,0.05);
        }
        .bottom-nav button {
            flex: 1; padding: 8px; background: none; border: none;
            color: #606060; font-size: 9px; cursor: pointer;
        }
        .bottom-nav button.on { color: var(--accent); }
        .search {
            width: 100%; padding: 10px; background: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 14px;
            color: #fff; margin-bottom: 10px;
        }
        .section-title { font-size: 11px; color: #a0a0a0; margin: 12px 0 8px; }
        .settings-section {
            background: var(--card-bg); border-radius: 14px;
            padding: 14px; margin-bottom: 8px;
        }
        .toggle-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; }
        .switch {
            width: 44px; height: 24px; background: rgba(255,255,255,0.1);
            border-radius: 12px; cursor: pointer; position: relative;
        }
        .switch.on { background: var(--accent); }
        .switch::after {
            content: ''; position: absolute; width: 20px; height: 20px;
            background: #fff; border-radius: 50%; top: 2px; left: 2px;
            transition: 0.3s;
        }
        .switch.on::after { left: 22px; }
    </style>
</head>
<body>
    <div class="header">
        <span>📊</span>
        <h1>Crypto Tracker Pro</h1>
        <span class="ws-status" id="wsStatus">🟢 Live</span>
    </div>

    <div class="nav" id="topNav">
        <button class="nav-btn active" data-tab="prices">💰 Цены</button>
        <button class="nav-btn" data-tab="portfolio">💼 Портфель</button>
        <button class="nav-btn" data-tab="favorites">⭐ Избранное</button>
        <button class="nav-btn" data-tab="alerts">🔔 Алерты</button>
        <button class="nav-btn" data-tab="trading">📈 Трейдинг</button>
        <button class="nav-btn" data-tab="tools">🛠 Инструменты</button>
        <button class="nav-btn" data-tab="profile">👤 Профиль</button>
    </div>

    <div class="container" id="mainContainer">
        <!-- PRICES -->
        <div class="tab active" id="tab-prices">
            <input type="text" class="search" id="searchInput" placeholder="🔍 Поиск криптовалюты...">
            <div class="section-title">🔥 Популярные</div>
            <div class="coin-grid" id="coinGrid"></div>
        </div>

        <!-- PORTFOLIO -->
        <div class="tab" id="tab-portfolio">
            <div style="text-align:center;padding:20px;">
                <div style="font-size:9px;color:#a0a0a0;">ОБЩАЯ СТОИМОСТЬ</div>
                <div style="font-size:30px;font-weight:800;" id="pfValue">$0.00</div>
                <div id="pfPnl"></div>
            </div>
            <div id="pfList"></div>
            <button class="btn btn-filled" id="btnAddToPortfolio">+ Добавить монету</button>
            <button class="btn" id="btnClearPortfolio">Очистить всё</button>
        </div>

        <!-- FAVORITES -->
        <div class="tab" id="tab-favorites">
            <div class="coin-grid" id="favGrid"></div>
        </div>

        <!-- ALERTS -->
        <div class="tab" id="tab-alerts">
            <div id="alertList"></div>
            <button class="btn btn-filled" id="btnAddAlert">+ Новый алерт</button>
        </div>

        <!-- TRADING -->
        <div class="tab" id="tab-trading">
            <div style="text-align:center;padding:20px;">
                <div style="font-size:30px;font-weight:800;" id="tradingBalance">$10,000</div>
            </div>
            <button class="btn btn-filled" id="btnQuickBuy">📈 Быстрая ПОКУПКА</button>
            <button class="btn btn-danger" id="btnQuickSell">📉 Быстрая ПРОДАЖА</button>
            <button class="btn btn-danger" id="btnResetTrading">Сбросить трейдинг</button>
        </div>

        <!-- TOOLS -->
        <div class="tab" id="tab-tools">
            <div class="settings-section">
                <b>🎯 Калькулятор прибыли</b><br>
                <input type="text" id="calcSymbol" placeholder="Символ (BTC)" style="margin:6px 0;">
                <input type="number" id="calcInvest" placeholder="Инвестиция ($)" style="margin:6px 0;">
                <input type="number" id="calcTarget" placeholder="Целевая цена ($)" style="margin:6px 0;">
                <button class="btn btn-filled" id="btnCalcProfit">Рассчитать</button>
                <div id="calcResult" style="margin-top:8px;font-size:11px;"></div>
            </div>
        </div>

        <!-- PROFILE -->
        <div class="tab" id="tab-profile">
            <div class="settings-section">
                <b>⚙️ Настройки</b>
                <div class="toggle-row">
                    <span>🌙 Тёмная тема</span>
                    <div class="switch on" id="themeSwitch"></div>
                </div>
            </div>
            <button class="btn btn-danger" id="btnResetAll">🗑 Сбросить все данные</button>
        </div>
    </div>

    <!-- MODAL -->
    <div class="modal" id="coinModal">
        <div class="modal-box">
            <button id="modalCloseBtn" style="float:right;background:none;border:none;color:#fff;font-size:18px;cursor:pointer;">✕</button>
            <div style="font-size:18px;" id="modSym"></div>
            <div style="font-size:28px;font-weight:800;margin:8px 0;" id="modPrice"></div>
            <button class="btn btn-filled" id="btnModalFav">⭐ Избранное</button>
            <button class="btn" id="btnModalAddPf">+ Портфель</button>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <div class="bottom-nav" id="bottomNav">
        <button class="bottom-btn on" data-tab="prices">💰 Цены</button>
        <button class="bottom-btn" data-tab="portfolio">💼 Портфель</button>
        <button class="bottom-btn" data-tab="trading">📈 Трейдинг</button>
        <button class="bottom-btn" data-tab="tools">🛠 Инструменты</button>
        <button class="bottom-btn" data-tab="profile">👤 Профиль</button>
    </div>

    <script>
    // Утилиты
    function toast(msg) {
        var t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(function() { t.classList.remove('show'); }, 2000);
    }

    function fmt(p) {
        if (!p || isNaN(p)) return '0';
        if (p < 0.0001) return p.toFixed(8);
        if (p < 0.01) return p.toFixed(6);
        if (p < 1) return p.toFixed(4);
        if (p < 100) return p.toFixed(2);
        return p.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
    }

    function $(id) { return document.getElementById(id); }

    // Данные
    var allCoins = [];
    var favorites = JSON.parse(localStorage.getItem('ct_fav') || '[]');
    var portfolio = JSON.parse(localStorage.getItem('ct_pf') || '[]');
    var alerts = JSON.parse(localStorage.getItem('ct_al') || '[]');
    var tradingBalance = parseFloat(localStorage.getItem('ct_bal') || '10000');
    var trades = JSON.parse(localStorage.getItem('ct_tr') || '[]');
    var currentCoin = 'BTC';
    var darkMode = true;

    // API
    async function loadData() {
        try {
            var resp = await fetch('https://api.binance.com/api/v3/ticker/24hr');
            var data = await resp.json();
            allCoins = data
                .filter(function(i) { return i.symbol.endsWith('USDT'); })
                .map(function(i) {
                    return {
                        s: i.symbol.replace('USDT', ''),
                        p: parseFloat(i.lastPrice),
                        c: parseFloat(i.priceChangePercent)
                    };
                })
                .filter(function(c) { return c.p > 0; });
            allCoins.sort(function(a, b) { return b.c - a.c; });
            updatePrices();
        } catch(e) {
            console.error(e);
        }
    }

    // Отрисовка
    function coinCard(c) {
        var fav = favorites.indexOf(c.s) >= 0;
        return '<div class="coin-card" data-symbol="' + c.s + '">' +
            '<div>' + c.s + (fav ? ' ⭐' : ' ☆') + '</div>' +
            '<div class="coin-price">$' + fmt(c.p) + '</div>' +
            '<div class="' + (c.c >= 0 ? 'up' : 'down') + '">' +
            (c.c >= 0 ? '+' : '') + c.c.toFixed(2) + '%</div>' +
            '</div>';
    }

    function updatePrices() {
        var grid = $('coinGrid');
        if (!grid) return;
        var q = ($('searchInput') && $('searchInput').value || '').toUpperCase();
        var coins = q ? allCoins.filter(function(c) { return c.s.indexOf(q) >= 0; }) : allCoins;
        grid.innerHTML = coins.slice(0, 30).map(coinCard).join('');
        bindCoinCards();
    }

    function updateAll() {
        updatePrices();
        updatePortfolio();
        updateFavorites();
        updateAlerts();
    }

    function updatePortfolio() {
        var list = $('pfList'), val = $('pfValue'), pnl = $('pfPnl');
        if (!list) return;
        if (portfolio.length === 0) {
            list.innerHTML = '<div style="text-align:center;padding:20px;color:#606060;">Портфель пуст</div>';
            if (val) val.textContent = '$0.00';
            if (pnl) pnl.innerHTML = '';
            return;
        }
        var total = 0;
        list.innerHTML = portfolio.map(function(item, i) {
            var coin = allCoins.find(function(c) { return c.s === item.symbol; });
            var cp = coin ? coin.p : 0;
            var cur = item.amount * cp;
            total += cur;
            return '<div style="padding:10px;margin:4px 0;background:#141414;border-radius:10px;">' +
                '<strong>' + item.symbol + '</strong>: ' + item.amount + ' × $' + fmt(item.buyPrice) +
                ' | Сейчас: $' + fmt(cur) +
                ' <button data-action="removePf" data-index="' + i + '" style="color:red;cursor:pointer;background:none;border:none;">✕</button>' +
                '</div>';
        }).join('');
        if (val) val.textContent = '$' + fmt(total);
        bindRemoveButtons();
    }

    function updateFavorites() {
        var grid = $('favGrid');
        if (!grid) return;
        var favs = allCoins.filter(function(c) { return favorites.indexOf(c.s) >= 0; });
        grid.innerHTML = favs.length > 0 ? favs.map(coinCard).join('') : '<div style="text-align:center;padding:20px;color:#606060;">Избранное пусто</div>';
        bindCoinCards();
    }

    function updateAlerts() {
        var list = $('alertList');
        if (!list) return;
        if (alerts.length === 0) {
            list.innerHTML = '<div style="text-align:center;padding:20px;color:#606060;">Нет алертов</div>';
            return;
        }
        list.innerHTML = alerts.map(function(a, i) {
            return '<div style="padding:10px;margin:4px 0;background:#141414;border-radius:10px;">' +
                '<strong>' + a.symbol + '</strong>: $' + fmt(a.price) +
                ' <button data-action="removeAlert" data-index="' + i + '" style="color:red;cursor:pointer;background:none;border:none;">✕</button>' +
                '</div>';
        }).join('');
        bindRemoveButtons();
    }

    // Привязка событий карточек
    function bindCoinCards() {
        document.querySelectorAll('.coin-card').forEach(function(card) {
            card.onclick = function() {
                var sym = card.dataset.symbol;
                if (sym) openModal(sym);
            };
        });
    }

    function bindRemoveButtons() {
        document.querySelectorAll('[data-action="removePf"]').forEach(function(btn) {
            btn.onclick = function(e) {
                e.stopPropagation();
                portfolio.splice(parseInt(btn.dataset.index), 1);
                localStorage.setItem('ct_pf', JSON.stringify(portfolio));
                updateAll();
            };
        });
        document.querySelectorAll('[data-action="removeAlert"]').forEach(function(btn) {
            btn.onclick = function(e) {
                e.stopPropagation();
                alerts.splice(parseInt(btn.dataset.index), 1);
                localStorage.setItem('ct_al', JSON.stringify(alerts));
                updateAll();
            };
        });
    }

    // Навигация
    function switchTab(name) {
        document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
        var tab = $('tab-' + name);
        if (tab) tab.classList.add('active');
        document.querySelectorAll('.nav-btn, .bottom-btn').forEach(function(b) { b.classList.remove('active', 'on'); });
        document.querySelectorAll('[data-tab="' + name + '"]').forEach(function(b) {
            b.classList.add(b.classList.contains('nav-btn') ? 'active' : 'on');
        });
        if (name === 'favorites') updateFavorites();
        if (name === 'alerts') updateAlerts();
        if (name === 'portfolio') updatePortfolio();
        if (name === 'trading') updateTrading();
    }

    document.querySelectorAll('.nav-btn, .bottom-btn').forEach(function(btn) {
        btn.onclick = function() { switchTab(btn.dataset.tab); };
    });

    // Модалка
    function openModal(sym) {
        currentCoin = sym;
        var c = allCoins.find(function(x) { return x.s === sym; });
        if (!c) return;
        $('modSym').textContent = sym;
        $('modPrice').textContent = '$' + fmt(c.p);
        $('coinModal').classList.add('show');
    }

    $('modalCloseBtn').onclick = function() { $('coinModal').classList.remove('show'); };
    $('coinModal').onclick = function(e) { if (e.target === $('coinModal')) $('coinModal').classList.remove('show'); };

    // Кнопки
    $('btnModalFav').onclick = function() {
        var i = favorites.indexOf(currentCoin);
        if (i >= 0) { favorites.splice(i, 1); toast('Удалено из избранного'); }
        else { favorites.push(currentCoin); toast('⭐ Добавлено'); }
        localStorage.setItem('ct_fav', JSON.stringify(favorites));
        updateAll();
    };

    $('btnModalAddPf').onclick = function() {
        var amount = prompt('Количество ' + currentCoin + ':');
        if (!amount || isNaN(amount)) return;
        var price = prompt('Цена покупки USD:');
        if (!price || isNaN(price)) return;
        portfolio.push({ symbol: currentCoin, amount: parseFloat(amount), buyPrice: parseFloat(price) });
        localStorage.setItem('ct_pf', JSON.stringify(portfolio));
        updateAll();
        $('coinModal').classList.remove('show');
        toast('✅ Добавлено');
    };

    $('btnAddToPortfolio').onclick = function() {
        var sym = prompt('Символ монеты (BTC):');
        if (!sym) return;
        var amount = prompt('Количество:');
        if (!amount || isNaN(amount)) return;
        var price = prompt('Цена покупки USD:');
        if (!price || isNaN(price)) return;
        portfolio.push({ symbol: sym.toUpperCase(), amount: parseFloat(amount), buyPrice: parseFloat(price) });
        localStorage.setItem('ct_pf', JSON.stringify(portfolio));
        updateAll();
        switchTab('portfolio');
        toast('✅ Добавлено');
    };

    $('btnClearPortfolio').onclick = function() {
        if (portfolio.length && confirm('Удалить весь портфель?')) {
            portfolio = [];
            localStorage.setItem('ct_pf', JSON.stringify(portfolio));
            updateAll();
            toast('Портфель очищен');
        }
    };

    $('btnAddAlert').onclick = function() {
        var sym = prompt('Символ монеты:');
        if (!sym) return;
        var price = prompt('Целевая цена USD:');
        if (!price || isNaN(price)) return;
        alerts.push({ symbol: sym.toUpperCase(), price: parseFloat(price), dir: 'above' });
        localStorage.setItem('ct_al', JSON.stringify(alerts));
        updateAll();
        toast('🔔 Алерт создан');
    };

    $('btnQuickBuy').onclick = function() { quickTrade('BUY'); };
    $('btnQuickSell').onclick = function() { quickTrade('SELL'); };

    function quickTrade(type) {
        var sym = prompt('Символ:');
        if (!sym) return;
        var coin = allCoins.find(function(c) { return c.s === sym.toUpperCase(); });
        if (!coin) { toast('Монета не найдена'); return; }
        var amount = parseFloat(prompt('Количество:'));
        if (!amount || amount <= 0) return;
        var total = coin.p * amount;
        if (type === 'BUY') {
            if (total > tradingBalance) { toast('Недостаточно средств!'); return; }
            tradingBalance -= total;
        } else {
            tradingBalance += total;
        }
        trades.push({ type: type, symbol: sym.toUpperCase(), amount: amount, price: coin.p, total: total });
        localStorage.setItem('ct_bal', tradingBalance.toString());
        localStorage.setItem('ct_tr', JSON.stringify(trades));
        updateTrading();
        toast(type === 'BUY' ? 'Куплено!' : 'Продано!');
    }

    function updateTrading() {
        var tb = $('tradingBalance');
        if (tb) tb.textContent = '$' + fmt(tradingBalance);
    }

    $('btnResetTrading').onclick = function() {
        if (confirm('Сбросить трейдинг?')) {
            tradingBalance = 10000;
            trades = [];
            localStorage.setItem('ct_bal', '10000');
            localStorage.setItem('ct_tr', JSON.stringify(trades));
            updateTrading();
            toast('Сброшено');
        }
    };

    $('btnCalcProfit').onclick = function() {
        var sym = ($('calcSymbol').value || '').toUpperCase();
        var coin = allCoins.find(function(c) { return c.s === sym; });
        if (!coin) { toast('Монета не найдена'); return; }
        var inv = parseFloat($('calcInvest').value);
        var target = parseFloat($('calcTarget').value);
        if (!inv || !target) return;
        var coins = inv / coin.p;
        var future = coins * target;
        var profit = future - inv;
        $('calcResult').innerHTML = 'Прибыль: <strong>$' + fmt(profit) + '</strong> (' + ((profit/inv)*100).toFixed(1) + '%)';
    };

    // Тема
    $('themeSwitch').onclick = function() {
        darkMode = !darkMode;
        if (darkMode) {
            document.body.style.background = '#0a0a0a';
            document.body.style.color = '#ffffff';
            $('themeSwitch').classList.add('on');
        } else {
            document.body.style.background = '#f5f6f8';
            document.body.style.color = '#1a1a1a';
            $('themeSwitch').classList.remove('on');
        }
        toast(darkMode ? '🌙 Тёмная тема' : '☀️ Светлая тема');
    };

    $('btnResetAll').onclick = function() {
        if (confirm('Сбросить ВСЕ данные?')) {
            localStorage.clear();
            portfolio = []; favorites = []; alerts = []; trades = [];
            tradingBalance = 10000;
            updateAll();
            toast('Всё сброшено');
        }
    };

    // Поиск
    $('searchInput').oninput = function() { updatePrices(); };

    // WebSocket
    function connectWS() {
        try {
            var ws = new WebSocket('wss://stream.binance.com:9443/ws/!ticker@arr');
            ws.onmessage = function(e) {
                JSON.parse(e.data).forEach(function(t) {
                    if (!t.s.endsWith('USDT')) return;
                    var sym = t.s.replace('USDT', '');
                    var coin = allCoins.find(function(c) { return c.s === sym; });
                    if (coin) {
                        coin.p = parseFloat(t.c);
                        coin.c = parseFloat(t.P);
                    }
                });
                if (!window._ut) { window._ut = setTimeout(function() { updatePrices(); window._ut = null; }, 500); }
            };
            ws.onclose = function() { setTimeout(connectWS, 5000); };
        } catch(e) {}
    }

    // Запуск
    loadData();
    connectWS();
    setInterval(loadData, 30000);
    </script>
</body>
