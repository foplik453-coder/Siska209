<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0a0a">
    <title>WebStore</title>
    <style>
        :root {
            --bg: #fafafa;
            --surface: #ffffff;
            --text: #0a0a0a;
            --text-secondary: #6b6b6b;
            --border: #e5e5e5;
            --danger: #ef4444;
            --success: #10b981;
            --warning: #f59e0b;
            --star: #f59e0b;
            --star-empty: #d4d4d4;
            --heart: #ef4444;
            --heart-empty: #d4d4d4;
            --radius: 12px;
            --radius-sm: 8px;
            --bottom-nav-height: 60px;
            --transition: 0.2s ease;
            --shadow: 0 1px 3px rgba(0,0,0,0.06);
            --shadow-lg: 0 4px 12px rgba(0,0,0,0.08);
            --font-size: 14px;
            --store-name: 'WebStore';
            --store-primary: #0a0a0a;
        }

        [data-theme="dark"] {
            --bg: #09090b;
            --surface: #18181b;
            --text: #fafafa;
            --text-secondary: #a1a1aa;
            --border: #27272a;
            --star-empty: #52525b;
            --heart-empty: #52525b;
            --shadow: 0 1px 3px rgba(0,0,0,0.3);
            --shadow-lg: 0 4px 12px rgba(0,0,0,0.4);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.45;
            padding-bottom: var(--bottom-nav-height);
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            transition: background 0.3s, color 0.3s;
            font-size: var(--font-size);
        }

        .header {
            position: sticky;
            top: 0;
            z-index: 50;
            background: var(--bg);
            border-bottom: 1px solid var(--border);
            padding: 10px 14px;
        }

        .header-inner {
            max-width: 960px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 19px;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: -0.3px;
            color: var(--store-primary);
        }

        .header-actions { display: flex; gap: 5px; }

        .icon-btn {
            position: relative;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            width: 36px;
            height: 36px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition);
        }

        .icon-btn:hover { border-color: var(--text); transform: translateY(-1px); box-shadow: var(--shadow); }
        .badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background: var(--danger);
            color: #fff;
            font-size: 9px;
            font-weight: 700;
            min-width: 16px;
            height: 16px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .carousel-container {
            max-width: 960px;
            margin: 0 auto 10px;
            position: relative;
            overflow: hidden;
            border-radius: var(--radius);
            touch-action: pan-y;
            user-select: none;
        }

        .carousel-track {
            display: flex;
            transition: transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .carousel-slide {
            min-width: 100%;
            padding: 24px 20px;
            color: #fff;
            text-align: center;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .carousel-slide::before {
            content: '';
            position: absolute;
            top: -30px;
            right: -30px;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
        }

        .slide-new { background: linear-gradient(135deg, #0a0a0a, #333); }
        .slide-sale { background: linear-gradient(135deg, #ef4444, #dc2626); }
        .slide-discount { background: linear-gradient(135deg, #f59e0b, #d97706); }
        .slide-premium { background: linear-gradient(135deg, #8b5cf6, #6d28d9); }

        .slide-icon { font-size: 36px; position: relative; z-index: 1; margin-bottom: 6px; }
        .slide-title { font-size: 20px; font-weight: 700; position: relative; z-index: 1; margin-bottom: 2px; }
        .slide-subtitle { font-size: 13px; opacity: 0.9; position: relative; z-index: 1; }

        .carousel-dots { display: flex; justify-content: center; gap: 6px; padding: 8px; }
        .carousel-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border); cursor: pointer; transition: all var(--transition); }
        .carousel-dot.active { background: var(--text); width: 20px; border-radius: 4px; }

        .carousel-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 32px;
            height: 32px;
            background: rgba(255,255,255,0.2);
            border: none;
            border-radius: 50%;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .carousel-nav:hover { background: rgba(255,255,255,0.35); }
        .carousel-prev { left: 8px; }
        .carousel-next { right: 8px; }

        .search-bar { max-width: 960px; margin: 0 auto; padding: 0 14px 10px; display: flex; gap: 6px; flex-wrap: wrap; }
        .search-input {
            flex: 1;
            min-width: 150px;
            padding: 10px 14px;
            border: 2px solid var(--border);
            border-radius: var(--radius);
            background: var(--surface);
            color: var(--text);
            font-size: 14px;
            outline: none;
            transition: border var(--transition);
        }

        .search-input:focus { border-color: var(--text); }
        .filter-btn, .sort-btn {
            padding: 8px 13px;
            border: 2px solid var(--border);
            border-radius: var(--radius);
            background: var(--surface);
            color: var(--text);
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
            transition: all var(--transition);
        }

        .filter-btn:hover, .sort-btn:hover { border-color: var(--text); }
        .filter-btn.active, .sort-btn.active { background: var(--text); color: var(--bg); border-color: var(--text); }

        .filters-panel { width: 100%; display: flex; gap: 6px; flex-wrap: wrap; padding: 6px 0; animation: slideDown 0.25s ease; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }

        .filter-chip {
            padding: 5px 12px;
            border: 1px solid var(--border);
            border-radius: 100px;
            font-size: 11px;
            cursor: pointer;
            background: var(--surface);
            color: var(--text-secondary);
            transition: all var(--transition);
        }

        .filter-chip:hover { border-color: var(--text); color: var(--text); }
        .filter-chip.active { background: var(--text); color: var(--bg); border-color: var(--text); }
        .filter-chip .count { opacity: 0.6; font-size: 10px; margin-left: 3px; }

        .quick-categories { max-width: 960px; margin: 0 auto 10px; padding: 0 14px; display: flex; gap: 8px; flex-wrap: wrap; }
        .quick-cat {
            flex: 1;
            min-width: 65px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 10px 6px;
            text-align: center;
            cursor: pointer;
            transition: all var(--transition);
            font-size: 22px;
        }

        .quick-cat:hover { border-color: var(--text); transform: translateY(-2px); box-shadow: var(--shadow); }
        .quick-cat-label { font-size: 9px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; margin-top: 2px; }

        .tabs { max-width: 960px; margin: 0 auto; padding: 0 14px; display: flex; gap: 2px; overflow-x: auto; border-bottom: 1px solid var(--border); }
        .tabs::-webkit-scrollbar { display: none; }
        .tab {
            padding: 10px 13px;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
            cursor: pointer;
            border: none;
            background: none;
            white-space: nowrap;
            position: relative;
            transition: color var(--transition);
        }

        .tab.active { color: var(--text); }
        .tab.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 6px;
            right: 6px;
            height: 2px;
            background: var(--text);
            border-radius: 1px;
            animation: tabLine 0.25s ease;
        }

        @keyframes tabLine { from { transform: scaleX(0); } to { transform: scaleX(1); } }

        .bottom-nav {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: var(--bottom-nav-height);
            background: var(--bg);
            border-top: 1px solid var(--border);
            z-index: 50;
            padding-bottom: env(safe-area-inset-bottom, 0);
        }

        .bottom-nav-inner { display: flex; justify-content: space-around; align-items: center; height: 100%; max-width: 960px; margin: 0 auto; }
        .bottom-nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
            cursor: pointer;
            border: none;
            background: none;
            color: var(--text-secondary);
            font-size: 8px;
            font-weight: 600;
            text-transform: uppercase;
            padding: 5px 8px;
            position: relative;
            border-radius: 6px;
            transition: all var(--transition);
        }

        .bottom-nav-item.active { color: var(--text); }
        .bottom-nav-icon { font-size: 19px; transition: transform var(--transition); }
        .bottom-nav-item.active .bottom-nav-icon { transform: scale(1.1); }
        .bottom-nav-badge {
            position: absolute;
            top: -1px;
            right: -5px;
            background: var(--danger);
            color: #fff;
            font-size: 7px;
            min-width: 14px;
            height: 14px;
            border-radius: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .main-content { max-width: 960px; margin: 0 auto; padding: 10px 14px 14px; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .section { display: none; }
        .section.active { display: block; }

        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(158px, 1fr)); gap: 10px; }
        .products-list { display: flex; flex-direction: column; gap: 10px; }
        .products-list .product-card { display: flex; flex-direction: row; align-items: center; }
        .products-list .product-image { width: 80px; height: 80px; font-size: 30px; flex-shrink: 0; }
        .products-list .product-info { flex: 1; }

        .product-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            cursor: pointer;
            position: relative;
            transition: all var(--transition);
            box-shadow: var(--shadow);
        }

        .product-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); border-color: var(--text); }
        .product-image {
            width: 100%;
            aspect-ratio: 1;
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            position: relative;
            overflow: hidden;
        }

        .product-image img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s ease; }
        .product-card:hover .product-image img { transform: scale(1.04); }

        .favorite-btn {
            position: absolute;
            top: 6px;
            right: 6px;
            z-index: 5;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 13px;
            color: var(--heart-empty);
            transition: all var(--transition);
            box-shadow: var(--shadow);
        }

        .favorite-btn:hover { transform: scale(1.15); border-color: var(--heart); }
        .favorite-btn.active { color: var(--heart); border-color: var(--heart); animation: heartBeat 0.4s ease; }

        @keyframes heartBeat { 0%{transform:scale(1)} 30%{transform:scale(1.3)} 60%{transform:scale(0.9)} 100%{transform:scale(1)} }

        .sale-badge { position: absolute; top: 6px; left: 6px; background: var(--danger); color: #fff; padding: 2px 7px; border-radius: 100px; font-size: 9px; font-weight: 700; }
        .rating-badge { position: absolute; top: 6px; left: 6px; background: var(--warning); color: #000; padding: 2px 7px; border-radius: 100px; font-size: 10px; font-weight: 600; }
        .product-badge { position: absolute; top: 34px; left: 6px; background: var(--text); color: var(--bg); padding: 2px 8px; border-radius: 100px; font-size: 9px; font-weight: 700; }

        .product-info { padding: 10px 12px; }
        .product-name { font-size: 14px; font-weight: 600; margin-bottom: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .product-price { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
        .product-old-price { font-size: 11px; color: var(--text-secondary); text-decoration: line-through; margin-bottom: 2px; }
        .product-dop { font-size: 10px; color: var(--text-secondary); margin-bottom: 7px; padding: 3px 8px; background: var(--bg); border-radius: 4px; display: inline-block; }

        .product-card-actions { position: absolute; bottom: 8px; right: 8px; display: flex; gap: 4px; opacity: 0; transition: opacity var(--transition); }
        .product-card:hover .product-card-actions { opacity: 1; }
        .product-action-btn {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            cursor: pointer;
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition);
            box-shadow: var(--shadow);
        }

        .product-action-btn:hover { background: var(--text); color: var(--bg); transform: scale(1.1); }
        .product-action-btn.danger:hover { background: var(--danger); border-color: var(--danger); color: #fff; }

        .btn {
            width: 100%;
            padding: 9px 14px;
            border: 2px solid var(--text);
            background: var(--text);
            color: var(--bg);
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            transition: all var(--transition);
        }

        .btn:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
        .btn-outline { background: transparent; color: var(--text); }
        .btn-outline:hover { background: var(--text); color: var(--bg); }
        .btn-sm { width: auto; padding: 5px 11px; font-size: 10px; }
        .btn-danger { background: var(--danger); border-color: var(--danger); color: #fff; }
        .btn-success { background: var(--success); border-color: var(--success); color: #fff; }

        .profile-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px 20px; text-align: center; margin-bottom: 12px; box-shadow: var(--shadow); }
        .avatar-wrapper { position: relative; width: 72px; height: 72px; margin: 0 auto 10px; cursor: pointer; }
        .avatar {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: var(--store-primary);
            color: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            font-weight: 700;
            overflow: hidden;
            border: 3px solid var(--border);
            transition: all var(--transition);
        }

        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .avatar-edit-badge {
            position: absolute;
            bottom: -2px;
            right: -2px;
            width: 22px;
            height: 22px;
            background: var(--store-primary);
            color: var(--bg);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            border: 2px solid var(--bg);
        }

        .role-badge { display: inline-block; padding: 2px 10px; border-radius: 100px; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-left: 6px; }
        .role-owner { background: var(--warning); color: #000; }
        .role-moderator { background: #3b82f6; color: #fff; }
        .role-user { background: var(--border); color: var(--text-secondary); }

        .profile-name { font-size: 19px; font-weight: 700; margin-bottom: 2px; }
        .profile-email { color: var(--text-secondary); font-size: 13px; margin-bottom: 10px; }
        .profile-stats { display: flex; justify-content: center; gap: 22px; margin: 10px 0; flex-wrap: wrap; }
        .stat { text-align: center; padding: 6px 14px; background: var(--bg); border-radius: var(--radius-sm); transition: all var(--transition); }
        .stat:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
        .stat-value { font-size: 20px; font-weight: 700; }
        .stat-label { font-size: 9px; color: var(--text-secondary); text-transform: uppercase; }

        .stars { display: inline-flex; gap: 1px; }
        .star { color: var(--star); font-size: 15px; }
        .star.empty { color: var(--star-empty); }
        .star.interactive { cursor: pointer; font-size: 26px; transition: transform var(--transition); }
        .star.interactive:hover { transform: scale(1.2); }

        .review-card { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; margin-bottom: 6px; }
        .review-header { display: flex; justify-content: space-between; margin-bottom: 4px; }
        .review-author { font-size: 12px; font-weight: 600; }
        .review-date { font-size: 9px; color: var(--text-secondary); }
        .review-text { font-size: 12px; color: var(--text-secondary); }

        .cart-item { display: flex; gap: 10px; padding: 11px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 8px; align-items: center; animation: slideIn 0.25s ease; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(-15px); } to { opacity: 1; transform: translateX(0); } }
        .cart-item-image { width: 46px; height: 46px; background: var(--bg); border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; overflow: hidden; border: 1px solid var(--border); }
        .cart-item-image img { width: 100%; height: 100%; object-fit: cover; }
        .cart-item-info { flex: 1; }
        .cart-item-name { font-size: 13px; font-weight: 600; }
        .cart-item-price { font-size: 12px; color: var(--text-secondary); }
        .qty-control { display: flex; align-items: center; gap: 6px; }
        .qty-btn { width: 28px; height: 28px; border: 2px solid var(--border); background: var(--bg); color: var(--text); border-radius: 6px; cursor: pointer; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; transition: all var(--transition); }
        .qty-btn:hover { border-color: var(--text); background: var(--text); color: var(--bg); }
        .cart-total { margin-top: 12px; padding: 15px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); display: flex; justify-content: space-between; align-items: center; box-shadow: var(--shadow); }
        .total-label { font-size: 12px; text-transform: uppercase; color: var(--text-secondary); font-weight: 600; }
        .total-price { font-size: 20px; font-weight: 700; }

        .order-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 15px; margin-bottom: 10px; box-shadow: var(--shadow); }
        .order-header { display: flex; justify-content: space-between; margin-bottom: 8px; }
        .order-id { font-weight: 700; font-size: 14px; }
        .order-date { font-size: 10px; color: var(--text-secondary); }
        .order-status-badge { display: inline-block; padding: 3px 9px; border-radius: 100px; font-size: 9px; font-weight: 700; text-transform: uppercase; }
        .status-pending { background: var(--warning); color: #000; }
        .status-processing { background: #3b82f6; color: #fff; }
        .status-shipped { background: #8b5cf6; color: #fff; }
        .status-delivered { background: var(--success); color: #fff; }
        .status-cancelled { background: var(--danger); color: #fff; }
        .order-address { font-size: 12px; color: var(--text-secondary); margin: 8px 0; padding: 9px; background: var(--bg); border-radius: var(--radius-sm); border: 1px solid var(--border); }
        .order-items-list { margin: 8px 0; }
        .order-item-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 12px; }
        .order-total { font-weight: 700; font-size: 14px; }
        .status-menu { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 9px; padding-top: 9px; border-top: 1px solid var(--border); }
        .status-btn { padding: 4px 9px; border: 1px solid var(--border); border-radius: 100px; font-size: 9px; font-weight: 600; cursor: pointer; background: var(--bg); color: var(--text); transition: all var(--transition); text-transform: uppercase; }
        .status-btn:hover { border-color: var(--text); }
        .status-btn.active { background: var(--text); color: var(--bg); }

        .news-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 15px; margin-bottom: 10px; cursor: pointer; box-shadow: var(--shadow); transition: all var(--transition); position: relative; }
        .news-card:hover { border-color: var(--text); transform: translateY(-1px); box-shadow: var(--shadow-lg); }
        .news-actions { position: absolute; top: 8px; right: 8px; display: flex; gap: 4px; opacity: 0; transition: opacity var(--transition); }
        .news-card:hover .news-actions { opacity: 1; }
        .news-date { font-size: 9px; color: var(--text-secondary); text-transform: uppercase; margin-bottom: 3px; font-weight: 600; }
        .news-title { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
        .news-text { font-size: 13px; color: var(--text-secondary); line-height: 1.5; }
        .reactions { display: flex; gap: 8px; margin-top: 8px; }
        .reaction-btn { background: none; border: 1px solid var(--border); border-radius: 100px; padding: 3px 10px; cursor: pointer; font-size: 13px; transition: all var(--transition); }
        .reaction-btn:hover { background: var(--bg); border-color: var(--text); }
        .reaction-btn.active { background: var(--text); color: var(--bg); border-color: var(--text); }
        .news-categories { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
        .news-cat { padding: 5px 12px; border: 1px solid var(--border); border-radius: 100px; font-size: 11px; cursor: pointer; transition: all var(--transition); }
        .news-cat.active { background: var(--text); color: var(--bg); border-color: var(--text); }

        .support-q { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 14px; margin-bottom: 6px; cursor: pointer; transition: all var(--transition); font-size: 13px; }
        .support-q:hover { border-color: var(--text); background: var(--bg); }
        .chat-msg { padding: 10px 14px; border-radius: var(--radius-sm); margin-bottom: 6px; max-width: 85%; font-size: 13px; }
        .chat-msg.bot { background: var(--bg); border: 1px solid var(--border); }
        .chat-msg.user { background: var(--text); color: var(--bg); margin-left: auto; }
        .chat-input-row { display: flex; gap: 6px; }
        .chat-input { flex: 1; padding: 10px 14px; border: 2px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); color: var(--text); font-size: 13px; outline: none; }
        .ticket-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 14px; margin-bottom: 6px; }
        .ticket-header { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-secondary); }
        .rate-btns { display: flex; gap: 4px; margin-top: 6px; }
        .rate-btn { background: none; border: 1px solid var(--border); border-radius: 4px; padding: 2px 8px; cursor: pointer; font-size: 14px; }

        .settings-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 15px; margin-bottom: 10px; box-shadow: var(--shadow); }
        .settings-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
        .settings-row:last-child { border-bottom: none; }
        .settings-label { font-size: 13px; font-weight: 600; }
        .toggle { position: relative; width: 46px; height: 25px; cursor: pointer; }
        .toggle input { display: none; }
        .toggle-slider { position: absolute; inset: 0; background: var(--border); border-radius: 25px; transition: background var(--transition); }
        .toggle-slider:before { content: ''; position: absolute; width: 19px; height: 19px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: transform var(--transition); }
        .toggle input:checked + .toggle-slider { background: var(--text); }
        .toggle input:checked + .toggle-slider:before { transform: translateX(21px); }
        .theme-options { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
        .theme-option { padding: 8px 15px; border: 2px solid var(--border); border-radius: var(--radius-sm); cursor: pointer; font-size: 12px; font-weight: 600; background: var(--surface); color: var(--text); transition: all var(--transition); }
        .theme-option.active { background: var(--text); color: var(--bg); border-color: var(--text); }
        .user-list-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
        .user-list-name { font-size: 13px; font-weight: 600; }
        .user-list-role { font-size: 11px; color: var(--text-secondary); }
        .role-select { padding: 4px 8px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 11px; background: var(--bg); color: var(--text); cursor: pointer; }

        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 100; display: flex; align-items: center; justify-content: center; opacity: 0; visibility: hidden; transition: opacity 0.25s; }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px; max-width: 480px; width: 92%; max-height: 85vh; overflow-y: auto; transform: translateY(20px) scale(0.96); transition: transform 0.3s ease; box-shadow: 0 16px 40px rgba(0,0,0,0.2); }
        .modal-overlay.active .modal { transform: translateY(0) scale(1); }
        .modal-title { font-size: 18px; font-weight: 700; margin-bottom: 13px; }
        .modal-text { font-size: 13px; color: var(--text-secondary); margin-bottom: 16px; line-height: 1.5; }
        .modal-actions { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; }

        .toast-container { position: fixed; top: 10px; right: 10px; z-index: 200; display: flex; flex-direction: column; gap: 6px; max-width: 300px; pointer-events: none; }
        .toast { background: var(--text); color: var(--bg); padding: 10px 15px; border-radius: var(--radius-sm); font-size: 12px; font-weight: 500; pointer-events: all; animation: toastIn 0.3s ease; box-shadow: var(--shadow-lg); border: 1px solid var(--border); }
        .toast.hiding { animation: toastOut 0.25s ease forwards; }
        @keyframes toastIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes toastOut { from { transform: translateX(0); opacity: 1; } to { transform: translateX(100%); opacity: 0; } }

        .form-group { margin-bottom: 13px; }
        .form-label { display: block; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-secondary); margin-bottom: 4px; }
        .form-input, .form-textarea { width: 100%; padding: 10px 12px; border: 2px solid var(--border); border-radius: var(--radius-sm); background: var(--bg); color: var(--text); font-size: 13px; font-family: inherit; outline: none; transition: border var(--transition); }
        .form-input:focus, .form-textarea:focus { border-color: var(--text); }
        .form-input.error { border-color: var(--danger); animation: shake 0.35s ease; }
        @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-3px)} 75%{transform:translateX(3px)} }
        .form-textarea { resize: vertical; min-height: 70px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .image-upload-area { width: 100%; max-width: 160px; aspect-ratio: 1; margin: 0 auto 12px; border: 2px dashed var(--border); border-radius: var(--radius); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 38px; background: var(--bg); color: var(--text-secondary); transition: all var(--transition); }
        .image-upload-area:hover { border-color: var(--text); }
        .image-upload-area.has-image { border-style: solid; border-color: var(--text); }
        .image-upload-area img { width: 100%; height: 100%; object-fit: cover; }

        .fab { position: fixed; bottom: 72px; right: 14px; width: 48px; height: 48px; background: var(--store-primary); color: var(--bg); border: none; border-radius: 50%; font-size: 24px; cursor: pointer; z-index: 40; display: none; box-shadow: var(--shadow-lg); transition: all var(--transition); }
        .fab:hover { transform: scale(1.08); }
        .fab.visible { display: flex; align-items: center; justify-content: center; animation: fabIn 0.35s ease; }
        @keyframes fabIn { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .flying-item { position: fixed; z-index: 999; pointer-events: none; font-size: 28px; transition: all 0.5s cubic-bezier(0.2, 0.8, 0.3, 1); filter: drop-shadow(0 2px 6px rgba(0,0,0,0.2)); }
        .empty-state { text-align: center; padding: 44px 14px; color: var(--text-secondary); }
        .empty-icon { font-size: 48px; margin-bottom: 8px; opacity: 0.35; }
        .empty-text { font-size: 13px; }

        @media (max-width: 768px) {
            .tabs { display: none; }
            .bottom-nav { display: block; }
            .products-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
            .form-row { grid-template-columns: 1fr; }
            .modal { padding: 16px; }
        }

        @media (min-width: 769px) {
            .bottom-nav { display: none; }
            .tabs { display: flex; }
        }
    </style>
</head>

        <section class="section" id="section-favorites"></section>
        <section class="section" id="section-cart"></section>
        <section class="section" id="section-settings"></section>

    <button class="fab" id="fabAdd" onclick="handleFabClick()">+</button>

    <nav class="bottom-nav" id="bottomNav">
        <div class="bottom-nav-inner">
            <button class="bottom-nav-item active" data-tab="profile" onclick="navigateTo('profile')"><span class="bottom-nav-icon">👤</span>Профиль</button>
            <button class="bottom-nav-item" data-tab="news" onclick="navigateTo('news')"><span class="bottom-nav-icon">📰</span>Новости</button>
            <button class="bottom-nav-item" data-tab="catalog" onclick="navigateTo('catalog')"><span class="bottom-nav-icon">🛍</span>Каталог</button>

            <div class="modal-text" id="modalText"></div>
            <div class="modal-actions" id="modalActions"></div>
        </div>
    </div>
    <input type="file" id="hiddenFileInput" accept="image/*" style="display:none" onchange="handleFileSelect(event)">

    <script>
        // ============================================
        // КОНФИГУРАЦИЯ МАГАЗИНА (НАСТРАИВАЕМОЕ)
        // ============================================
        const STORE_CONFIG = {
            name: 'WebStore',
            primaryColor: '#0a0a0a',
            ownerId: 427123456,
            moderatorIds: [111222333, 444555666],
            currency: '₽',
            promocodes: {
                'SALE20': { type: 'percent', value: 20, minOrder: 0 },
                'WELCOME10': { type: 'percent', value: 10, minOrder: 0 },
                'VIP500': { type: 'fixed', value: 500, minOrder: 3000 }
            },
            paymentMethods: [
                { id: 'card', name: 'Банковская карта', icon: '💳' },
                { id: 'cash', name: 'Наличные при получении', icon: '💵' },
                { id: 'stars', name: 'Telegram Stars', icon: '⭐' }
            ]
        };

        // Применяем название магазина
        document.documentElement.style.setProperty('--store-name', `'${STORE_CONFIG.name}'`);
        document.documentElement.style.setProperty('--store-primary', STORE_CONFIG.primaryColor);
        document.getElementById('storeLogo').textContent = STORE_CONFIG.name;
        document.title = STORE_CONFIG.name;

        // ============================================
        // БЕЗОПАСНОСТЬ (XSS-защита, валидация)
        // ============================================
        const Security = {
            sanitizeHTML(str) {
                if (!str) return '';
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            },

            validateEmail(email) {
                return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
            },

            validatePhone(phone) {
                return /^\+?[\d\s\-()]{7,20}$/.test(phone);
            },

            validatePrice(price) {
                return !isNaN(price) && price >= 0 && price <= 99999999;
            },

            validateName(name) {
                return name && name.length >= 2 && name.length <= 100 && !/<[^>]*>/.test(name);
            },

            validateText(text, maxLength = 5000) {
                return text && text.length <= maxLength && !/<script[^>]*>/.test(text);
            },

            escapeRegExp(string) {
                return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            },

            sanitizeURL(url) {
                try {
                    const parsed = new URL(url);
                    return parsed.protocol === 'http:' || parsed.protocol === 'https:' ? url : '';
                } catch {
                    return '';
                }
            }
        };

        // ============================================
        // БАЗА ДАННЫХ (SQLite-подобный слой)
        // ============================================
        const Database = {
            _storage: null,

            init() {
                this._storage = localStorage;
                if (!this._storage.getItem('webstore_db')) {
                    this._storage.setItem('webstore_db', JSON.stringify({
                        users: [],
                        products: [],
                        orders: [],
                        news: [],
                        carts: {},
                        favorites: [],
                        tickets: [],
                        reviews: {},
                        settings: {}
                    }));
                }
                return this;
            },

            _read() {
                try {
                    const raw = this._storage.getItem('webstore_db');
                    return raw ? JSON.parse(raw) : { users: [], products: [], orders: [], news: [], carts: {}, favorites: [], tickets: [], reviews: {}, settings: {} };
                } catch(e) {
                    console.error('Database read error:', e);
                    return { users: [], products: [], orders: [], news: [], carts: {}, favorites: [], tickets: [], reviews: {}, settings: {} };
                }
            },

            _write(data) {
                try {
                    this._storage.setItem('webstore_db', JSON.stringify(data));
                    return true;
                } catch(e) {
                    console.error('Database write error:', e);
                    return false;
                }
            },

            // Пользователи
            getUser(id) {
                const db = this._read();
                return db.users.find(u => u.id === id) || null;
            },

            saveUser(user) {
                const db = this._read();
                const index = db.users.findIndex(u => u.id === user.id);
                if (index > -1) db.users[index] = user;
                else db.users.push(user);
                return this._write(db);
            },

            // Товары
            getProducts() {
                const db = this._read();
                return db.products || [];
            },

            saveProduct(product) {
                const db = this._read();
                const index = db.products.findIndex(p => p.id === product.id);
                if (index > -1) db.products[index] = product;
                else db.products.push(product);
                return this._write(db);
            },

            deleteProduct(id) {
                const db = this._read();
                db.products = db.products.filter(p => p.id !== id);
                return this._write(db);
            },

            // Заказы
            getOrders() {
                const db = this._read();
                return db.orders || [];
            },

            saveOrder(order) {
                const db = this._read();
                const index = db.orders.findIndex(o => o.id === order.id);
                if (index > -1) db.orders[index] = order;
                else db.orders.push(order);
                return this._write(db);
            },

            // Новости
            getNews() {
                const db = this._read();
                return db.news || [];
            },

            saveNews(news) {
                const db = this._read();
                const index = db.news.findIndex(n => n.id === news.id);
                if (index > -1) db.news[index] = news;
                else db.news.push(news);
                return this._write(db);
            },

            deleteNews(id) {
                const db = this._read();
                db.news = db.news.filter(n => n.id !== id);
                return this._write(db);
            },

            // Корзина
            getCart(userId) {
                const db = this._read();
                return db.carts[userId] || {};
            },

            saveCart(userId, cart) {
                const db = this._read();
                db.carts[userId] = cart;
                return this._write(db);
            },

            // Избранное
            getFavorites() {
                const db = this._read();
                return db.favorites || [];
            },

            saveFavorites(favorites) {
                const db = this._read();
                db.favorites = favorites;
                return this._write(db);
            },

            // Тикеты
            getTickets() {
                const db = this._read();
                return db.tickets || [];
            },

            saveTicket(ticket) {
                const db = this._read();
                db.tickets.push(ticket);
                return this._write(db);
            },

            // Настройки
            getSettings() {
                const db = this._read();
                return db.settings || { theme: 'auto', notifications: true, language: 'ru', fontSize: 'medium' };
            },

            saveSettings(settings) {
                const db = this._read();
                db.settings = settings;
                return this._write(db);
            },

            // Отзывы
            getReviews(productId) {
                const db = this._read();
                return db.reviews[productId] || [];
            },

            saveReview(productId, review) {
                const db = this._read();
                if (!db.reviews[productId]) db.reviews[productId] = [];
                db.reviews[productId].push(review);
                return this._write(db);
            },

            // Экспорт данных
            exportData() {
                return JSON.stringify(this._read(), null, 2);
            },

            // Импорт данных
            importData(jsonStr) {
                try {
                    const data = JSON.parse(jsonStr);
                    return this._write(data);
                } catch(e) {
                    return false;
                }
            }
        };

        // Инициализация БД
        Database.init();

        // ============================================
        // ДАННЫЕ ПРИЛОЖЕНИЯ
        // ============================================
        const defaultProducts = [
            { id: 1, name: 'Минималистичный рюкзак', price: 4900, oldPrice: 6900, image: '🎒', imageUrl: 'https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=300&h=300&fit=crop', category: 'Аксессуары', description: 'Чёрный рюкзак из прочной ткани', dop: '30×45×15 см', isDefault: true, rating: 4.5, onSale: true, priceHistory: [4500, 5200, 6900, 4900] },
            { id: 2, name: 'Белая футболка', price: 1900, image: '👕', imageUrl: 'https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=300&h=300&fit=crop', category: 'Одежда', description: 'Базовая футболка из органического хлопка', dop: '100% хлопок', isDefault: true, rating: 4.8, isNew: true, priceHistory: [1500, 1900] },
            { id: 3, name: 'Чёрные джинсы', price: 5900, oldPrice: 7900, image: '👖', imageUrl: 'https://images.unsplash.com/photo-1542272454315-4c01d7abdf4a?w=300&h=300&fit=crop', category: 'Одежда', description: 'Классические прямые джинсы', dop: 'S-XXL', isDefault: true, rating: 4.2, onSale: true, priceHistory: [5500, 7900, 5900] },
            { id: 4, name: 'Кожаный ремень', price: 2900, image: '🪢', imageUrl: 'https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=300&h=300&fit=crop', category: 'Аксессуары', description: 'Натуральная кожа', dop: '3.5 см', isDefault: true, rating: 4.0, priceHistory: [2500, 2900] },
            { id: 5, name: 'Керамическая кружка', price: 1200, image: '☕', imageUrl: 'https://images.unsplash.com/photo-1514228742587-6b1558fcca3d?w=300&h=300&fit=crop', category: 'Дом', description: 'Ручная работа', dop: '350 мл', isDefault: true, rating: 4.9, isNew: true, priceHistory: [900, 1200] },
            { id: 6, name: 'Блокнот A5', price: 800, image: '📓', imageUrl: 'https://images.unsplash.com/photo-1531346878377-a5be20888e57?w=300&h=300&fit=crop', category: 'Канцелярия', description: 'Твёрдая обложка', dop: '192 стр.', isDefault: true, rating: 4.3, priceHistory: [600, 800] }
        ];

        const defaultNews = [
            { id: 1, date: '2026-06-19', title: 'Новая коллекция лето 2026', text: 'Представляем минималистичную коллекцию лето 2026.', authorId: STORE_CONFIG.ownerId, authorName: 'Владелец', category: 'Акции', reactions: { '👍': 5, '🔥': 3, '❤️': 2 } },
            { id: 2, date: '2026-06-15', title: 'Бесплатная доставка', text: 'При заказе от 5000 — бесплатная доставка.', authorId: STORE_CONFIG.ownerId, authorName: 'Владелец', category: 'Акции', reactions: { '👍': 10, '🔥': 7, '❤️': 4 } },
            { id: 3, date: '2026-06-10', title: 'Закрытая распродажа', text: 'Скидка 20% на аксессуары по промокоду SALE20.', authorId: 111222333, authorName: 'Модератор', category: 'События', reactions: { '👍': 3, '🔥': 1 } },
            { id: 4, date: '2026-06-05', title: 'Открытие шоурума', text: 'Приходите к нам в центр Москвы!', authorId: STORE_CONFIG.ownerId, authorName: 'Владелец', category: 'События', reactions: { '👍': 8, '❤️': 6 } }
        ];

        const defaultUser = {
            id: STORE_CONFIG.ownerId,
            firstName: 'Алексей',
            lastName: 'Иванов',
            username: 'alex_ivanov',
            photoUrl: null,
            email: 'alex@example.com',
            phone: '+7 999 123-45-67',
            country: 'Россия',
            city: 'Москва',
            address: 'ул. Примерная, д. 1, кв. 42',
            bio: '',
            avatarEmoji: '👤',
            accentColor: STORE_CONFIG.primaryColor,
            role: 'owner',
            password: '1234',
            history: [{ action: 'Аккаунт создан', date: '2026-06-01' }]
        };

        // Загрузка данных из БД
        function loadAppData() {
            const db = Database._read();
            return {
                user: Database.getUser(STORE_CONFIG.ownerId) || defaultUser,
                products: db.products.length > 0 ? [...defaultProducts, ...db.products.filter(p => !defaultProducts.find(dp => dp.id === p.id))] : [...defaultProducts],
                customProducts: db.products || [],
                customNews: db.news || [],
                cart: Database.getCart(STORE_CONFIG.ownerId),
                orders: Database.getOrders(),
                favorites: Database.getFavorites(),
                tickets: Database.getTickets(),
                settings: Database.getSettings(),
                sortBy: 'default',
                filterCategory: 'all',
                viewMode: 'grid',
                newsCategory: 'all',

        function getAllProducts() {
            let p = [...defaultProducts, ...appData.customProducts.filter(x => !defaultProducts.find(dp => dp.id === x.id))];
            const s = appData.sortBy;
            if (s === 'price-asc') p.sort((a,b) => a.price - b.price);
            else if (s === 'price-desc') p.sort((a,b) => b.price - a.price);
            else if (s === 'rating') p.sort((a,b) => (b.rating||0) - (a.rating||0));
            else if (s === 'name') p.sort((a,b) => a.name.localeCompare(b.name));
            return p;
        }

        function genId(arr) { return Math.max(0, ...arr.map(x => x.id)) + 1; }
        function getSimilarProducts(product, count = 3) { return getAllProducts().filter(p => p.id !== product.id && p.category === product.category).slice(0, count); }

        function applyTheme(t) {
            if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
            else if (t === 'light') document.documentElement.removeAttribute('data-theme');
            else { if (window.matchMedia?.('(prefers-color-scheme: dark)').matches) document.documentElement.setAttribute('data-theme', 'dark'); else document.documentElement.removeAttribute('data-theme'); }
            appData.settings.theme = t; saveAppData();
        }

        function applyFontSize(size) {
            const sizes = { small: '12px', medium: '14px', large: '16px' };
            document.documentElement.style.setProperty('--font-size', sizes[size] || '14px');
            appData.settings.fontSize = size; saveAppData();
        }

        function initTheme() {
            applyTheme(appData.settings.theme || 'auto');
            applyFontSize(appData.settings.fontSize || 'medium');

        function startCarousel() { if (currentTab !== 'catalog') return; stopCarousel(); carouselInterval = setInterval(() => { if (!isSwiping) { carouselIndex = (carouselIndex + 1) % carouselSlides.length; updateCarousel(); } }, 4000); }
        function stopCarousel() { clearInterval(carouselInterval); }
        function updateCarousel() { const track = document.getElementById('carouselTrack'); const dots = document.querySelectorAll('.carousel-dot'); if (!track) return; track.style.transition = 'transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94)'; track.style.transform = `translateX(-${carouselIndex * 100}%)`; dots.forEach((d, i) => d.classList.toggle('active', i === carouselIndex)); }
        function slideTo(i) { carouselIndex = i; updateCarousel(); stopCarousel(); startCarousel(); }
        function initCarouselSwipe() { const c = document.querySelector('.carousel-container'); if (!c) return; c.addEventListener('touchstart', hs, { passive: true }); c.addEventListener('touchmove', hm, { passive: false }); c.addEventListener('touchend', he, { passive: true }); c.addEventListener('mousedown', hs); c.addEventListener('mousemove', hm); c.addEventListener('mouseup', he); c.addEventListener('mouseleave', he); }
        function hs(e) { if (e.type==='mousedown'&&e.button!==0) return; stopCarousel(); isSwiping=true; swipeStartX=e.type.includes('mouse')?e.clientX:e.touches[0].clientX; swipeCurrentX=swipeStartX; const t=document.getElementById('carouselTrack'); if(t)t.style.transition='none'; }
        function hm(e) { if(!isSwiping)return; swipeCurrentX=e.type.includes('mouse')?e.clientX:e.touches[0].clientX; const d=swipeCurrentX-swipeStartX; const t=document.getElementById('carouselTrack'); if(!t)return; const w=t.parentElement.offsetWidth; const o=-carouselIndex*100+(d/w)*100; t.style.transform=`translateX(${Math.max(-(carouselSlides.length-1)*100,Math.min(0,o))}%)`; if(Math.abs(d)>10)e.preventDefault(); }
        function he() { if(!isSwiping)return; const d=swipeCurrentX-swipeStartX; const t=document.getElementById('carouselTrack'); if(t)t.style.transition='transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94)'; if(d<-50&&carouselIndex<carouselSlides.length-1)carouselIndex++; else if(d>50&&carouselIndex>0)carouselIndex--; updateCarousel(); isSwiping=false; swipeStartX=0;swipeCurrentX=0; startCarousel(); }

        function navigateTo(tab) {
            stopCarousel(); currentTab = tab;
            document.querySelectorAll('#tabsNav .tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
            document.querySelectorAll('#bottomNav .bottom-nav-item').forEach(i => i.classList.toggle('active', i.dataset.tab === tab));
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            const sec = document.getElementById(`section-${tab}`); if (sec) sec.classList.add('active');
            const fab = document.getElementById('fabAdd');
            if (tab === 'catalog') { fab.textContent = '+'; fab.classList.add('visible'); }
            else if (tab === 'news' && isAdmin()) { fab.textContent = '✎'; fab.classList.add('visible'); }
            else fab.classList.remove('visible');
            renderSection(tab);
            if (tab === 'catalog') { startCarousel(); setTimeout(initCarouselSwipe, 100); }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        document.getElementById('tabsNav').onclick = e => { const tab = e.target.closest('.tab'); if (tab) navigateTo(tab.dataset.tab); };

        function renderSection(tab) {
            switch(tab) {
                case 'profile': renderProfile(); break;

                case 'favorites': renderFavorites(); break;
                case 'cart': renderCart(); break;
                case 'orders': renderOrders(); break;

                case 'settings': renderSettings(); break;

        // ============================================
        // TOAST (исправленный)
        // ============================================
        function toast(msg) {
            const container = document.getElementById('toastContainer');
            if (activeToasts.length >= 3) {
                const oldest = activeToasts.shift();
                if (oldest) { oldest.classList.add('hiding'); setTimeout(() => oldest.remove(), 250); }
            }
            const el = document.createElement('div');
            el.className = 'toast';
            el.textContent = msg;
            container.appendChild(el);
            activeToasts.push(el);
            const timer = setTimeout(() => {
                el.classList.add('hiding');
                const idx = activeToasts.indexOf(el);
                if (idx > -1) activeToasts.splice(idx, 1);
                setTimeout(() => el.remove(), 250);
            }, 5000);
            el._timer = timer;
        }

        // ============================================

        // ============================================
        function processPayment(order, method) {
            return new Promise((resolve) => {
                // Имитация обработки платежа
                const paymentId = 'PAY-' + Date.now().toString(36).toUpperCase();
                const amount = order.total;

                console.log(`[Payment] Processing ${amount} ${STORE_CONFIG.currency} via ${method.name}...`);
                console.log(`[Payment] Order: #${order.id}, Payment ID: ${paymentId}`);

                // Имитация задержки обработки
                setTimeout(() => {
                    const success = Math.random() > 0.1; // 90% успех
                    if (success) {
                        console.log(`[Payment] ✅ Payment successful: ${paymentId}`);
                        resolve({ success: true, paymentId, method: method.id });
                    } else {
                        console.log(`[Payment] ❌ Payment failed: ${paymentId}`);
                        resolve({ success: false, paymentId, error: 'Платёж отклонён. Попробуйте другой способ.' });
                    }
                }, 1500);
            });
        }

        function renderProfile(){const u=appData.user;const av=u.photoUrl?`<img src="${Security.sanitizeHTML(u.photoUrl)}">`:u.avatarEmoji;const r=getUserRole();const faq=[{q:'Как отследить заказ?',a:'В разделе «Заказы».'},{q:'Условия возврата',a:'14 дней, оригинальная упаковка.'},{q:'Способы оплаты',a:'Карты, наличные, Telegram Stars.'},{q:'Связаться с оператором',a:'@WebStoreBot'}];const profileChat=appData.supportChats['profile']||[];document.getElementById('section-profile').innerHTML=`<div class="profile-card"><div class="avatar-wrapper" onclick="openProfileEditor()"><div class="avatar" style="border-color:${u.accentColor}">${av}</div><div class="avatar-edit-badge" style="background:${u.accentColor}">✎</div></div><div class="profile-name">${Security.sanitizeHTML(u.firstName)} ${Security.sanitizeHTML(u.lastName)}<span class="role-badge ${r==='owner'?'role-owner':r==='moderator'?'role-moderator':'role-user'}">${r==='owner'?'Владелец':r==='moderator'?'Модератор':'Пользователь'}</span></div><div class="profile-email">@${Security.sanitizeHTML(u.username)} · ${Security.sanitizeHTML(u.email)}</div>${u.phone?`<p style="font-size:12px;">📞 ${Security.sanitizeHTML(u.phone)}</p>`:''}<button class="btn btn-outline btn-sm" onclick="openProfileEditor()">✎ Редактировать</button><button class="btn btn-outline btn-sm" onclick="openChangePassword()" style="margin-top:6px;">🔒 Сменить пароль</button><div class="profile-stats"><div class="stat"><div class="stat-value">${appData.orders.length}</div><div class="stat-label">Заказов</div></div><div class="stat"><div class="stat-value">${appData.favorites.length}</div><div class="stat-label">Избранное</div></div></div></div><div class="settings-card" style="margin-bottom:12px;"><h3 style="font-size:12px;text-transform:uppercase;color:var(--text-secondary);margin-bottom:10px;">💬 Поддержка</h3><input type="text" class="search-input" id="faqSearch" placeholder="Поиск по FAQ..." oninput="renderProfile()" style="margin-bottom:10px;"><div class="support-questions">${faq.filter(f=>!document.getElementById('faqSearch')?.value||f.q.toLowerCase().includes(document.getElementById('faqSearch')?.value.toLowerCase())).map(f=>`<div class="support-q" onclick="showFAQ('${Security.sanitizeHTML(f.q)}','${Security.sanitizeHTML(f.a)}')">${f.q}</div>`).join('')}</div><div style="margin-top:10px;">${profileChat.map(m=>`<div class="chat-msg ${m.type}">${Security.sanitizeHTML(m.text)}${m.rated?` <span style="font-size:10px;opacity:0.6;">(оценено)</span>`:''}</div>`).join('')}</div>${profileChat.length>0&&profileChat[profileChat.length-1].type==='bot'&&!profileChat[profileChat.length-1].rated?`<div class="rate-btns">Оцените ответ: <button class="rate-btn" onclick="rateProfileAnswer('👍')">👍</button><button class="rate-btn" onclick="rateProfileAnswer('👎')">👎</button></div>`:''}<div class="chat-input-row" style="margin-top:8px;"><input class="chat-input" id="profileChatInput" placeholder="Сообщение..." onkeydown="if(event.key==='Enter')sendProfileChat()"><button class="btn btn-sm" onclick="sendProfileChat()">📤</button></div><button class="btn btn-outline btn-sm" style="margin-top:8px;" onclick="createTicket()">🎫 Создать тикет</button>${appData.tickets.length?`<div style="margin-top:10px;"><p style="font-weight:600;font-size:12px;">Мои тикеты</p>${appData.tickets.map(t=>`<div class="ticket-card"><div class="ticket-header"><span>#${t.id}</span><span>${t.date}</span></div><p style="font-size:12px;">${Security.sanitizeHTML(t.text.substring(0,60))}...</p><span style="font-size:10px;color:var(--text-secondary);">${t.status}</span></div>`).join('')}</div>`:''}</div><div class="settings-card"><h3 style="font-size:12px;text-transform:uppercase;color:var(--text-secondary);margin-bottom:8px;">📋 История действий</h3>${(u.history||[]).map(h=>`<div style="padding:6px 0;border-bottom:1px solid var(--border);font-size:12px;"><span style="color:var(--text-secondary);font-size:10px;">${h.date}</span> — ${Security.sanitizeHTML(h.action)}</div>`).join('')||'<p style="color:var(--text-secondary);font-size:12px;">История пуста</p>'}</div><button class="btn btn-outline" onclick="navigateTo('settings')">⚙️ Настройки</button>`;}

rm-label">Страна</label><input class="form-input" id="editCountry" value="${Security.sanitizeHTML(u.country||'')}"></div><div class="form-group"><label class="form-label">Город</label><input class="form-input" id="editCity" value="${Security.sanitizeHTML(u.city||'')}"></div></div><div class="form-group"><label class="form-label">Адрес</label><input class="form-input" id="editAddress" value="${Security.sanitizeHTML(u.address||'')}"></div>`,`<button class="btn btn-outline btn-sm" onclick="closeModal()">Отмена</button><button class="btn btn-sm" onclick="saveProfile()">💾 Сохранить</button>`);}

        function renderCatalog(){const sec=document.getElementById('section-catalog');const slidesHtml=carouselSlides.map((s,i)=>`<div class="carousel-slide ${s.cls}" onclick="(${s.action.toString()})()"><div class="slide-icon">${s.icon}</div><div class="slide-title">${s.title}</div><div class="slide-subtitle">${s.subtitle}</div></div>`).join('');let prods=getAllProducts();if(appData.filterCategory!=='all')prods=prods.filter(p=>p.category===appData.filterCategory);if(searchQuery){const q=searchQuery.toLowerCase();prods=prods.filter(p=>p.name.toLowerCase().includes(q)||(p.category||'').toLowerCase().includes(q));}const viewIcon=appData.viewMode==='grid'?'📋':'🔲';sec.innerHTML=`<div class="carousel-container"><button class="carousel-nav carousel-prev" onclick="slideTo(${carouselIndex===0?carouselSlides.length-1:carouselIndex-1})">‹</button><button class="carousel-nav carousel-next" onclick="slideTo(${(carouselIndex+1)%carouselSlides.length})">›</button><div class="carousel-track" id="carouselTrack">${slidesHtml}</div></div><div class="carousel-dots">${carouselSlides.map((_,i)=>`<div class="carousel-dot${i===carouselIndex?' active':''}" onclick="slideTo(${i})"></div>`).join('')}</div><div class="quick-categories">${['Одежда','Аксессуары','Дом','Канцелярия'].map(c=>`<div class="quick-cat" onclick="setFilter('${c}')"><div>${c==='Одежда'?'👕':c==='Аксессуары'?'🎒':c==='Дом'?'☕':'📓'}</div><div class="quick-cat-label">${c}</div></div>`).join('')}</div><div class="search-bar"><input type="text" class="search-input" id="searchInput" placeholder="Поиск товаров..." value="${Security.sanitizeHTML(searchQuery)}" oninput="handleSearch()"><button class="sort-btn" id="sortBtn" onclick="toggleSort()">↕️ Сортировка</button><button class="filter-btn" id="filterBtn" onclick="toggleFilters()">🔍 Фильтры</button><button class="filter-btn" onclick="toggleViewMode()">${viewIcon} Вид</button><div class="filters-panel" id="filtersPanel" style="display:none;"></div></div>${prods.length?(appData.viewMode==='grid'?`<div class="products-grid">${prods.map(p=>productCard(p)).join('')}</div>`:`<div class="products-list">${prods.map(p=>productCard(p)).join('')}</div>`):'<div class="empty-state"><div class="empty-icon">🔍</div><div class="empty-text">Ничего не найдено</div></div>'}`;if(filtersVisible){document.getElementById('filtersPanel').style.display='flex';renderFilters();}const labels={'default':'По умолчанию','price-asc':'Цена ↑','price-desc':'Цена ↓','rating':'Рейтинг','name':'Название'};document.getElementById('sortBtn').textContent='↕️ '+(labels[appData.sortBy]||'Сортировка');updateCarousel();startCarousel();setTimeout(initCarouselSwipe,100);}
        function productCard(p){const img=p.imageUrl?`<img src="${Security.sanitizeURL(p.imageUrl)||p.imageUrl}" alt="${Security.sanitizeHTML(p.name)}">`:p.image;const fav=isFav(p.id);const isC=!p.isDefault;const saleBadge=p.onSale?'<div class="sale-badge">-30%</div>':'';const newBadge=p.isNew?'<div class="sale-badge" style="background:#3b82f6;">NEW</div>':'';const ratingBadge=p.rating&&!p.onSale&&!p.isNew?`<div class="rating-badge">★ ${p.rating.toFixed(1)}</div>`:'';return`<div class="product-card" onclick="showProduct(${p.id})"><div class="product-image">${img}${saleBadge}${newBadge}${ratingBadge}${isC?`<div class="product-badge">Моё</div>`:''}<button class="favorite-btn${fav?' active':''}" onclick="toggleFav(${p.id},event)">${fav?'❤️':'🤍'}</button>${isC?`<div class="product-card-actions"><button class="product-action-btn" onclick="event.stopPropagation();openEditProduct(${p.id})">✎</button><button class="product-action-btn danger" onclick="event.stopPropagation();deleteProduct(${p.id})">✕</button></div>`:''}</div><div class="product-info"><div class="product-name">${Security.sanitizeHTML(p.name)}</div>${p.oldPrice?`<div class="product-old-price">${p.oldPrice.toLocaleString()} ${STORE_CONFIG.currency}</div>`:''}<div class="product-price">${p.price.toLocaleString()} ${STORE_CONFIG.currency}</div>${p.dop?`<div class="product-dop">${Security.sanitizeHTML(p.dop)}</div>`:''}<button class="btn" onclick="event.stopPropagation();addToCart(${p.id},this)">В корзину</button></div></div>`;}
        function showProduct(id){const p=findProduct(id);if(!p)return;const img=p.imageUrl?`<img src="${Security.sanitizeURL(p.imageUrl)||p.imageUrl}" style="width:100%;height:100%;object-fit:cover;">`:`<span style="font-size:56px;">${p.image}</span>`;const reviews=Database.getReviews(id);let revHtml='';if(reviews.length){revHtml='<p style="font-weight:600;font-size:12px;margin:10px 0 6px;">Отзывы ('+reviews.length+')</p>';reviews.forEach(r=>{revHtml+=`<div class="review-card"><div class="review-header"><span class="review-author">${Security.sanitizeHTML(r.userName)}</span><span class="review-date">${r.date}</span></div><div style="margin-bottom:3px;">${renderStars(r.rating)}</div><div class="review-text">${Security.sanitizeHTML(r.text)}</div></div>`;});}const priceHistory=p.priceHistory?`<p style="font-size:11px;color:var(--text-secondary);margin:6px 0;">📉 История цен: ${p.priceHistory.map(ph=>ph.toLocaleString()+STORE_CONFIG.currency).join(' → ')}</p>`:'';const similar=getSimilarProducts(p);const similarHtml=similar.length?`<p style="font-weight:600;font-size:12px;margin-top:12px;">Похожие товары</p><div class="products-grid">${similar.map(sp=>productCard(sp)).join('')}</div>`:'';window._revRating=5;showModal(Security.sanitizeHTML(p.name),`<div style="width:100%;aspect-ratio:1;background:var(--bg);display:flex;align-items:center;justify-content:center;border-radius:8px;overflow:hidden;margin-bottom:12px;border:1px solid var(--border);">${img}</div>${p.oldPrice?`<p style="font-size:13px;color:var(--text-secondary);text-decoration:line-through;">${p.oldPrice.toLocaleString()} ${STORE_CONFIG.currency}</p>`:''}<p style="font-size:20px;font-weight:700;margin-bottom:6px;">${p.price.toLocaleString()} ${STORE_CONFIG.currency}</p>${p.rating?`<div style="margin-bottom:8px;">${renderStars(p.rating)} <span style="font-size:12px;color:var(--text-secondary);">${p.rating.toFixed(1)}</span></div>`:''}${priceHistory}${p.description?`<p style="color:var(--text-secondary);margin-bottom:6px;">${Security.sanitizeHTML(p.description)}</p>`:''}${revHtml}<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border);"><p style="font-weight:600;font-size:12px;margin-bottom:6px;">Оставить отзыв</p><div style="margin-bottom:6px;">${renderStars(0,true,(r)=>window._revRating=r)}</div><textarea class="form-textarea" id="reviewText" placeholder="Ваш отзыв..." style="min-height:55px;margin-bottom:6px;"></textarea><button class="btn btn-sm" onclick="submitReview(${p.id})">⭐ Отправить</button></div>${similarHtml}`,`<button class="btn btn-outline btn-sm" onclick="closeModal()">Закрыть</button><button class="btn btn-sm" onclick="addToCart(${p.id});closeModal();">🛒 В корзину</button>`);}
        function submitReview(pid){const t=document.getElementById('reviewText')?.value.trim();if(!Security.validateText(t,1000)){toast('Отзыв должен быть от 1 до 1000 символов');return;}const p=findProduct(pid);if(!p)return;const review={userName:appData.user.firstName||'Пользователь',rating:window._revRating||5,text:t,date:new Date().toISOString().slice(0,10)};Database.saveReview(pid,review);const reviews=Database.getReviews(pid);p.rating=Math.round(reviews.reduce((s,r)=>s+r.rating,0)/reviews.length*10)/10;p.reviews=reviews;saveAppData();closeModal();showProduct(pid);toast('Отзыв добавлен!');}
        function openCreateProduct(){tempImage=null;showModal('➕ Новый товар',`<div class="image-upload-area" id="productImageUpload" onclick="document.getElementById('hiddenFileInput').click();tempTarget='product';">📷</div><div class="form-group"><label class="form-label">Название *</label><input class="form-input" id="productName"></div><div class="form-group"><label class="form-label">Цена *</label><input class="form-input" id="productPrice" type="number" min="0"></div><div class="form-group"><label class="form-label">Старая цена</label><input class="form-input" id="productOldPrice" type="number" min="0"></div><div class="form-group"><label class="form-label">Категория</label><input class="form-input" id="productCategory"></div>`,`<button class="btn btn-outline btn-sm" onclick="closeModal()">Отмена</button><button class="btn btn-sm" onclick="saveNewProduct()">💾 Создать</button>`);}
        function saveNewProduct(){const n=document.getElementById('productName')?.value.trim();const p=parseInt(document.getElementById('productPrice')?.value);const op=parseInt(document.getElementById('productOldPrice')?.value)||0;if(!Security.validateName(n)){toast('Название должно быть от 2 до 100 символов');return;}if(!Security.validatePrice(p)){toast('Цена должна быть от 0 до 99 999 999');return;}const newProduct={id:genId(getAllProducts()),name:n,price:p,oldPrice:op||null,category:document.getElementById('productCategory')?.value.trim()||'',image:tempImage?'🖼':'📦',imageUrl:tempImage||null,isDefault:false,rating:0,reviews:[],priceHistory:[p]};appData.customProducts.push(newProduct);Database.saveProduct(newProduct);saveAppData();tempImage=null;closeModal();navigateTo('catalog');toast(`Товар "${n}" создан`);}
        function openEditProduct(id){const p=appData.customProducts.find(x=>x.id===id);if(!p)return;tempImage=p.imageUrl;showModal('✎ Редактировать',`<div class="image-upload-area${p.imageUrl?' has-image':''}" id="productImageUpload" onclick="document.getElementById('hiddenFileInput').click();tempTarget='product';">${p.imageUrl?`<img src="${Security.sanitizeHTML(p.imageUrl)}">`:'📷'}</div><div class="form-group"><label class="form-label">Название *</label><input class="form-input" id="productName" value="${Security.sanitizeHTML(p.name)}"></div><div class="form-group"><label class="form-label">Цена *</label><input class="form-input" id="productPrice" type="number" value="${p.price}"></div><div class="form-group"><label class="form-label">Категория</label><input class="form-input" id="productCategory" value="${Security.sanitizeHTML(p.category||'')}"></div>`,`<button class="btn btn-outline btn-sm" onclick="closeModal()">Отмена</button><button class="btn btn-sm" onclick="saveEditProduct(${id})">💾 Сохранить</button>`);}
        function saveEditProduct(id){const p=appData.customProducts.find(x=>x.id===id);if(!p)return;const n=document.getElementById('productName')?.value.trim();const pr=parseInt(document.getElementById('productPrice')?.value);if(!Security.validateName(n)){toast('Название должно быть от 2 до 100 символов');return;}if(!Security.validatePrice(pr)){toast('Цена должна быть от 0 до 99 999 999');return;}p.name=n;p.price=pr;p.category=document.getElementById('productCategory')?.value.trim()||'';p.imageUrl=tempImage;p.image=tempImage?'🖼':'📦';if(!p.priceHistory)p.priceHistory=[p.price];p.priceHistory.push(pr);Database.saveProduct(p);saveAppData();tempImage=null;closeModal();navigateTo('catalog');toast('Товар обновлён');}
        function deleteProduct(id){const p=appData.customProducts.find(x=>x.id===id);if(!p)return;showModal('🗑 Удалить?',`<p>Удалить <strong>${Security.sanitizeHTML(p.name)}</strong>?</p>`,`<button class="btn btn-outline btn-sm" onclick="closeModal()">Отмена</button><button class="btn btn-danger btn-sm" onclick="confirmDeleteProduct(${id})">🗑 Удалить</button>`);}
        function confirmDeleteProduct(id){appData.customProducts=appData.customProducts.filter(p=>p.id!==id);if(appData.cart[id])delete appData.cart[id];appData.favorites=appData.favorites.filter(f=>f!==id);Database.deleteProduct(id);saveAppData();closeModal();navigateTo('catalog');toast('Товар удалён');}
