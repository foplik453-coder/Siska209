<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>⚡ CryptoNeon</title>
    <style>
        :root {
            --bg: #000000;
            --card: #0a0a0a;
            --card2: #111111;
            --neon: #00ffff;
            --neon2: #ff00ff;
            --neon3: #00ff88;
            --neon4: #ff0066;
            --text: #ffffff;
            --text2: #888888;
            --border: #222222;
            --glow: 0 0 10px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Courier New', monospace;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding-bottom: 90px;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            letter-spacing: 0.5px;
        }

        /* Анимированные линии фона */
        .bg-lines {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            z-index: 0;
            opacity: 0.05;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                #fff 2px,
                #fff 4px
            );
        }

        /* HEADER */
        .header {
            background: #000;
            padding: 20px 16px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 2px solid var(--neon);
            box-shadow: 0 0 20px rgba(0,255,255,0.3);
        }
        .header-title {
            font-size: 24px;
            font-weight: 900;
            color: #fff;
            text-shadow: 
                0 0 10px var(--neon),
                0 0 20px var(--neon),
                0 0 40px var(--neon);
            letter-spacing: 3px;
        }
        .header-subtitle {
            font-size: 11px;
            color: var(--neon);
            letter-spacing: 4px;
            margin-top: 4px;
            text-shadow: 0 0 5px var(--neon);
        }
        .header-blinking {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: var(--neon3);
            border-radius: 50%;
            animation: blink 1s infinite;
            margin-right: 6px;
            box-shadow: 0 0 10px var(--neon3);
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }

        /* MARQUEE */
        .marquee {
            background: #000;
            padding: 10px 0;
            overflow: hidden;
            white-space: nowrap;
            border-bottom: 1px solid #333;
            position: sticky;
            top: 100px;
            z-index: 99;
        }
        .marquee-content {
            display: inline-block;
            animation: marquee 25s linear infinite;
        }
        @keyframes marquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        .marquee-item {
            display: inline-block;
            padding: 4px 12px;
            margin: 0 4px;
            background: #111;
            border: 1px solid #333;
            border-radius: 20px;
            font-size: 11px;
            font-family: monospace;
        }
        .m-up {
            color: var(--neon3);
            text-shadow: 0 0 5px var(--neon3);
        }
        .m-down {
            color: var(--neon4);
            text-shadow: 0 0 5px var(--neon4);
        }

        /* NAV */
        .nav {
            display: flex;
            gap: 5px;
            padding: 10px 8px;
            overflow-x: auto;
            background: #000;
            position: sticky;
            top: 140px;
            z-index: 98;
            scrollbar-width: none;
            border-bottom: 1px solid #1a1a1a;
        }
        .nav::-webkit-scrollbar { display: none; }
        .nav-btn {
            padding: 8px 14px;
            border-radius: 0;
            border: 1px solid #333;
            background: #0a0a0a;
            color: #888;
            font-size: 11px;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
            transition: all 0.3s;
            font-family: 'Courier New', monospace;
            text-transform: uppercase;
            letter-spacing: 1px;
            clip-path: polygon(5px 0, 100% 0, calc(100% - 5px) 100%, 0 100%);
        }
        .nav-btn.active {
            background: #000;
            color: var(--neon);
            border-color: var(--neon);
            box-shadow: 0 0 15px rgba(0,255,255,0.3);
            text-shadow: 0 0 5px var(--neon);
        }
        .nav-badge {
            background: var(--neon);
            color: #000;
            padding: 1px 5px;
            font-size: 9px;
            margin-left: 4px;
            font-weight: bold;
        }

        .container {
            padding: 12px;
            max-width: 500px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .tab { display: none; animation: glitchIn 0.3s ease; }
        .tab.active { display: block; }
        @keyframes glitchIn {
            0% { opacity: 0; transform: translateX(-5px); }
            20% { opacity: 0.5; transform: translateX(3px); }
            100% { opacity: 1; transform: translateX(0); }
        }

        /* SECTION */
        .section-title {
            font-size: 13px;
            font-weight: bold;
            margin: 20px 0 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-line {
            flex: 1;
            height: 1px;
            background: #333;
        }

        /* COIN GRID */
        .coin-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .coin-card {
            background: #0a0a0a;
            border: 1px solid #222;
            padding: 14px;
            cursor: pointer;
            position: relative;
            transition: all 0.3s;
            clip-path: polygon(3px 0, 100% 0, calc(100% - 3px) 100%, 0 100%);
        }
        .coin-card:hover {
            border-color: var(--neon);
            box-shadow: 0 0 10px rgba(0,255,255,0.15);
        }
        .coin-card:active {
            transform: scale(0.97);
            border-color: var(--neon2);
            box-shadow: 0 0 15px rgba(255,0,255,0.3);
        }
        .coin-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--neon), transparent);
            opacity: 0;
            transition: 0.3s;
        }
        .coin-card:active::before { opacity: 1; }

        .coin-sym {
            font-size: 14px;
            font-weight: 900;
            letter-spacing: 1px;
        }
        .coin-rank {
            font-size: 8px;
            color: #666;
            border: 1px solid #333;
            padding: 1px 5px;
            margin-left: 4px;
        }
        .coin-star {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 16px;
            cursor: pointer;
            z-index: 2;
            transition: 0.2s;
        }
        .coin-star:active { transform: scale(1.4); }
        .coin-price {
            font-size: 16px;
            font-weight: 900;
            margin: 6px 0;
            text-shadow: 0 0 8px rgba(0,255,136,0.5);
        }
        .price-up { color: var(--neon3); }
        .price-down { color: var(--neon4); }
        .coin-change {
            font-size: 11px;
            font-weight: bold;
        }
        .up {
            color: var(--neon3);
            text-shadow: 0 0 5px rgba(0,255,136,0.5);
        }
        .down {
            color: var(--neon4);
            text-shadow: 0 0 5px rgba(255,0,102,0.5);
        }
        .coin-vol {
            font-size: 9px;
            color: #666;
            margin-top: 2px;
        }

        /* POPULARITY BAR */
        .pop-bar {
            height: 2px;
            background: #1a1a1a;
            margin-top: 8px;
            overflow: hidden;
        }
        .pop-fill {
            height: 100%;
            background: var(--neon);
            box-shadow: 0 0 10px var(--neon);
            transition: width 0.5s ease;
        }

        /* SEARCH */
        .search-box {
            position: relative;
            margin: 12px 0;
        }
        .search-input {
            width: 100%;
            padding: 12px 16px 12px 40px;
            background: #0a0a0a;
            border: 1px solid #333;
            color: #fff;
            font-size: 13px;
            outline: none;
            font-family: 'Courier New', monospace;
            letter-spacing: 1px;
            clip-path: polygon(3px 0, 100% 0, calc(100% - 3px) 100%, 0 100%);
        }
        .search-input:focus {
            border-color: var(--neon);
            box-shadow: 0 0 15px rgba(0,255,255,0.2);
        }
        .search-input::placeholder { color: #555; }
        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #555;
        }

        /* PORTFOLIO */
        .pf-summary {
            background: #0a0a0a;
            border: 1px solid #222;
            padding: 20px;
            text-align: center;
            margin-bottom: 16px;
            position: relative;
            overflow: hidden;
        }
        .pf-summary::after {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(0,255,255,0.05), transparent);
        }
        .pf-label {
            font-size: 10px;
            color: #666;
            letter-spacing: 3px;
            text-transform: uppercase;
            position: relative;
            z-index: 1;
        }
        .pf-value {
            font-size: 36px;
            font-weight: 900;
            margin: 8px 0;
            position: relative;
            z-index: 1;
            text-shadow: 0 0 20px rgba(0,255,255,0.5);
        }
        .pf-pnl {
            font-size: 13px;
            position: relative;
            z-index: 1;
        }

        .pf-item {
            background: #0a0a0a;
            border: 1px solid #222;
            padding: 12px;
            margin-bottom: 6px;
            transition: 0.3s;
        }
        .pf-item:hover { border-color: #333; }
        .pf-sym { font-size: 14px; font-weight: 900; }
        .pf-delete {
            color: var(--neon4);
            cursor: pointer;
            font-size: 16px;
            text-shadow: 0 0 5px var(--neon4);
        }
        .pf-info { font-size: 10px; color: #666; margin-top: 4px; }
        .pf-pnl-line { font-size: 12px; font-weight: bold; margin-top: 4px; }

        .alert-item {
            background: #0a0a0a;
            border: 1px solid #222;
            padding: 12px;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .alert-badge {
            font-size: 9px;
            padding: 2px 8px;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .badge-above {
            background: rgba(0,255,136,0.1);
            color: var(--neon3);
            border: 1px solid var(--neon3);
            text-shadow: 0 0 5px var(--neon3);
        }
        .badge-below {
            background: rgba(255,0,102,0.1);
            color: var(--neon4);
            border: 1px solid var(--neon4);
            text-shadow: 0 0 5px var(--neon4);
        }

        /* PROFILE */
        .profile-card {
            background: #0a0a0a;
            border: 1px solid #222;
            padding: 20px;
            text-align: center;
            margin-bottom: 12px;
        }
        .profile-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 2px solid var(--neon);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            margin: 0 auto 12px;
            box-shadow: 0 0 20px rgba(0,255,255,0.3);
        }
        .profile-name {
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 2px;
        }
        .profile-username {
            color: var(--neon);
            font-size: 13px;
            text-shadow: 0 0 5px var(--neon);
        }
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 16px;
        }
        .stat-item {
            background: #0a0a0a;
            border: 1px solid #222;
            padding: 14px;
            text-align: center;
            transition: 0.3s;
        }
        .stat-item:hover { border-color: var(--neon); }
        .stat-value {
            font-size: 20px;
            font-weight: 900;
            text-shadow: 0 0 10px rgba(0,255,255,0.3);
        }
        .stat-label {
            font-size: 9px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 4px;
        }

        /* BUTTONS */
        .btn {
            width: 100%;
            padding: 14px;
            border: 1px solid #333;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin: 5px 0;
            transition: all 0.3s;
            font-family: 'Courier New', monospace;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: #0a0a0a;
            color: #fff;
            clip-path: polygon(3px 0, 100% 0, calc(100% - 3px) 100%, 0 100%);
        }
        .btn:active { transform: scale(0.97); }
        .btn-neon {
            border-color: var(--neon);
            color: var(--neon);
            text-shadow: 0 0 5px var(--neon);
            box-shadow: 0 0 10px rgba(0,255,255,0.2);
        }
        .btn-neon:hover {
            background: rgba(0,255,255,0.1);
            box-shadow: 0 0 20px rgba(0,255,255,0.4);
        }
        .btn-pink {
            border-color: var(--neon2);
            color: var(--neon2);
            text-shadow: 0 0 5px var(--neon2);
        }
        .btn-pink:hover {
            background: rgba(255,0,255,0.1);
            box-shadow: 0 0 20px rgba(255,0,255,0.3);
        }
        .btn-green {
            border-color: var(--neon3);
            color: var(--neon3);
            text-shadow: 0 0 5px var(--neon3);
        }

        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.95);
            z-index: 200;
            padding: 20px;
            backdrop-filter: blur(5px);
        }
        .modal.active { display: flex; align-items: center; justify-content: center; }
        .modal-box {
            background: #0a0a0a;
            border: 1px solid var(--neon);
            padding: 20px;
            width: 100%;
            max-width: 360px;
            animation: modalGlitch 0.3s ease;
            box-shadow: 0 0 30px rgba(0,255,255,0.2);
        }
        @keyframes modalGlitch {
            0% { transform: scale(0.9); opacity: 0; filter: blur(5px); }
            100% { transform: scale(1); opacity: 1; filter: blur(0); }
        }
        .modal-close {
            float: right;
            background: none;
            border: 1px solid #333;
            color: #fff;
            width: 30px;
            height: 30px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.3s;
        }
        .modal-close:hover {
            border-color: var(--neon4);
            color: var(--neon4);
            box-shadow: 0 0 10px rgba(255,0,102,0.3);
        }
        .modal-sym { font-size: 24px; font-weight: 900; letter-spacing: 2px; }
        .modal-price {
            font-size: 40px;
            font-weight: 900;
            margin: 10px 0;
            text-shadow: 0 0 20px rgba(0,255,255,0.5);
        }
        .modal-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin: 12px 0;
        }
        .modal-stat {
            background: #111;
            border: 1px solid #222;
            padding: 10px;
            text-align: center;
        }
        .modal-stat-label {
            font-size: 8px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .modal-stat-value {
            font-size: 14px;
            font-weight: 900;
            margin-top: 2px;
        }

        /* TOAST */
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: #0a0a0a;
            border: 1px solid var(--neon);
            color: #fff;
            padding: 12px 24px;
            font-size: 12px;
            font-weight: bold;
            z-index: 300;
            display: none;
            white-space: nowrap;
            box-shadow: 0 0 20px rgba(0,255,255,0.3);
            font-family: 'Courier New', monospace;
            letter-spacing: 1px;
        }
        .toast.show {
            display: block;
            animation: toastNeon 0.3s ease;
        }
        @keyframes toastNeon {
            from { transform: translateX(-50%) translateY(20px); opacity: 0; }
            to { transform: translateX(-50%) translateY(0); opacity: 1; }
        }

        /* BOTTOM NAV */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #000;
            display: flex;
            border-top: 1px solid #222;
            z-index: 100;
            padding: 4px;
        }
        .bottom-btn {
            flex: 1;
            padding: 8px 4px;
            border: none;
            background: none;
            color: #555;
            font-size: 8px;
            cursor: pointer;
            text-align: center;
            transition: 0.3s;
            font-family: 'Courier New', monospace;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .bottom-btn.active {
            color: var(--neon);
            text-shadow: 0 0 5px var(--neon);
        }
        .bottom-btn-icon { font-size: 20px; display: block; margin-bottom: 2px; }

        .empty {
            text-align: center;
            padding: 40px 20px;
            color: #555;
        }
        .empty-icon { font-size: 60px; margin-bottom: 10px; }

        .text-neon { color: var(--neon); text-shadow: 0 0 5px var(--neon); }
        .text-pink { color: var(--neon2); text-shadow: 0 0 5px var(--neon2); }
        .text-green { color: var(--neon3); text-shadow: 0 0 5px var(--neon3); }
    </style>
</head>
<body>

    <div class="bg-lines"></div>

    <!-- HEADER -->
    <div class="header">
        <div class="header-title">⚡ CRYPTO<span class="text-pink">NEON</span></div>
        <div class="header-subtitle"><span class="header-blinking"></span>LIVE TRACKER v2.0</div>
    </div>

    <!-- MARQUEE -->
    <div class="marquee">
        <div class="marquee-content" id="marquee">Loading data...</div>
    </div>

    <!-- NAV -->
    <div class="nav">
        <button class="nav-btn active" data-tab="prices">💰 PRICES</button>
        <button class="nav-btn" data-tab="portfolio">💼 PORTFOLIO <span class="nav-badge" id="badgePF">0</span></button>
        <button class="nav-btn" data-tab="favorites">⭐ FAV <span class="nav-badge" id="badgeFav">0</span></button>
        <button class="nav-btn" data-tab="alerts">🔔 ALERTS <span class="nav-badge" id="badgeAlerts">0</span></button>
        <button class="nav-btn" data-tab="profile">👤 PROFILE</button>
    </div>

    <div class="container">

        <!-- PRICES -->
        <div class="tab active" id="tab-prices">
            <div class="search-box">
                <span class="search-icon">⌕</span>
                <input type="text" class="search-input" id="searchInput" placeholder="SEARCH COIN..." oninput="updatePrices()">
            </div>
            <div class="section-title"><span class="text-green">▲</span> TOP GAINERS <span class="section-line"></span></div>
            <div class="coin-grid" id="gainersGrid"></div>
            <div class="section-title"><span class="text-pink">▼</span> TOP LOSERS <span class="section-line"></span></div>
            <div class="coin-grid" id="losersGrid"></div>
            <div class="section-title"><span class="text-neon">◆</span> POPULAR <span class="section-line"></span></div>
            <div class="coin-grid" id="popularGrid"></div>
        </div>

        <!-- PORTFOLIO -->
        <div class="tab" id="tab-portfolio">
            <div class="pf-summary">
                <div class="pf-label">TOTAL VALUE</div>
                <div class="pf-value text-neon" id="pfValue">$0.00</div>
                <div class="pf-pnl" id="pfPnl">Add coins to portfolio</div>
            </div>
            <div id="pfList"></div>
            <button class="btn btn-neon" onclick="addToPortfolio()">[ + ADD COIN ]</button>
            <button class="btn btn-pink" onclick="clearPortfolio()">[ CLEAR ALL ]</button>
        </div>

        <!-- FAVORITES -->
        <div class="tab" id="tab-favorites">
            <div class="coin-grid" id="favGrid"></div>
        </div>

        <!-- ALERTS -->
        <div class="tab" id="tab-alerts">
            <div id="alertList"></div>
            <button class="btn btn-neon" onclick="addAlert()">[ + NEW ALERT ]</button>
        </div>

        <!-- PROFILE -->
        <div class="tab" id="tab-profile">
            <div class="profile-card">
                <div class="profile-avatar">👤</div>
                <div class="profile-name" id="profName">USER</div>
                <div class="profile-username" id="profUsername">@username</div>
                <div style="font-size:10px;color:#555;margin-top:4px;" id="profId">ID: -----</div>
            </div>

            <div class="stat-grid">
                <div class="stat-item">
                    <div class="stat-value text-neon" id="statPortfolio">0</div>
                    <div class="stat-label">ASSETS</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value text-pink" id="statFavorites">0</div>
                    <div class="stat-label">FAVORITES</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value text-green" id="statAlerts">0</div>
                    <div class="stat-label">ALERTS</div>
                </div>
            </div>

            <div class="stat-grid" style="margin-top:8px;">
                <div class="stat-item">
                    <div class="stat-value" id="statInvested" style="color:#fff;">$0</div>
                    <div class="stat-label">INVESTED</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="statCurrent" style="color:#fff;">$0</div>
                    <div class="stat-label">CURRENT</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="statPnl">$0</div>
                    <div class="stat-label">TOTAL P/L</div>
                </div>
            </div>

            <button class="btn btn-pink" onclick="resetAll()" style="margin-top:12px;">[ RESET ALL DATA ]</button>
        </div>
    </div>

    <!-- MODAL -->
    <div class="modal" id="coinModal">
        <div class="modal-box">
            <button class="modal-close" onclick="closeModal()">✕</button>
            <div class="modal-sym" id="modSym">BTC</div>
            <div class="modal-price text-neon" id="modPrice">$0.00</div>
            <div class="modal-stats">
                <div class="modal-stat">
                    <div class="modal-stat-label">24H CHANGE</div>
                    <div class="modal-stat-value" id="modChange">0%</div>
                </div>
                <div class="modal-stat">
                    <div class="modal-stat-label">HIGH</div>
                    <div class="modal-stat-value" id="modHigh">$0</div>
                </div>
                <div class="modal-stat">
                    <div class="modal-stat-label">LOW</div>
                    <div class="modal-stat-value" id="modLow">$0</div>
                </div>
                <div class="modal-stat">
                    <div class="modal-stat-label">VOLUME</div>
                    <div class="modal-stat-value" id="modVolume">$0</div>
                </div>
            </div>
            <button class="btn btn-neon" id="modFavBtn" onclick="toggleFavModal()">[ FAVORITE ]</button>
            <button class="btn btn-green" onclick="addPfFromModal()">[ + PORTFOLIO ]</button>
            <button class="btn btn-neon" onclick="addAlertFromModal()">[ + ALERT ]</button>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <!-- BOTTOM NAV -->
    <div class="bottom-nav">
        <button class="bottom-btn active" data-tab="prices"><span class="bottom-btn-icon">💰</span>Prices</button>
        <button class="bottom-btn" data-tab="portfolio"><span class="bottom-btn-icon">💼</span>Portfolio</button>
        <button class="bottom-btn" data-tab="favorites"><span class="bottom-btn-icon">⭐</span>Favorites</button>
        <button class="bottom-btn" data-tab="alerts"><span class="bottom-btn-icon">🔔</span>Alerts</button>
        <button class="bottom-btn" data-tab="profile"><span class="bottom-btn-icon">👤</span>Profile</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        let allCoins = [];
        let favorites = JSON.parse(localStorage.getItem('neon_fav') || '[]');
        let portfolio = JSON.parse(localStorage.getItem('neon_pf') || '[]');
        let alerts = JSON.parse(localStorage.getItem('neon_alerts') || '[]');
        let currentCoin = 'BTC';

        async function loadData() {
            try {
                const r = await fetch('https://api.binance.com/api/v3/ticker/24hr');
                const d = await r.json();
                allCoins = d.filter(i => i.symbol.endsWith('USDT')).map(i => ({
                    s: i.symbol.replace('USDT', ''),
                    p: parseFloat(i.lastPrice),
                    c: parseFloat(i.priceChangePercent),
                    h: parseFloat(i.highPrice),
                    l: parseFloat(i.lowPrice),
                    v: parseFloat(i.volume),
                    q: parseFloat(i.quoteVolume)
                })).filter(c => c.p > 0 && c.q > 50000);
                
                allCoins.sort((a,b) => b.q - a.q);
                allCoins.forEach((c,i) => c.rank = i + 1);
                
                updateAll();
            } catch(e) {}
        }

        function fmtPrice(p) {
            if (!p) return '0';
            if (p < 0.001) return p.toFixed(6);
            if (p < 1) return p.toFixed(4);
            if (p < 100) return p.toFixed(2);
            return p.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
        }

        function fmtVol(v) {
            if (v > 1e9) return '$' + (v/1e9).toFixed(1) + 'B';
            if (v > 1e6) return '$' + (v/1e6).toFixed(0) + 'M';
            return '$' + (v/1e3).toFixed(0) + 'K';
        }

        function updateAll() {
            updatePrices();
            updateMarquee();
            updatePortfolio();
            updateFavorites();
            updateAlerts();
            updateProfile();
            updateBadges();
        }

        function coinHTML(c) {
            let fav = favorites.includes(c.s);
            let pop = Math.min(100, Math.round((c.q / (allCoins[0]?.q || 1)) * 100));
            let pc = c.p < 1 ? 'price-down' : 'price-up';
            return `<div class="coin-card" onclick="openModal('${c.s}')">
                <span class="coin-star" onclick="event.stopPropagation();toggleFav('${c.s}')">${fav?'⭐':'☆'}</span>
                <div><span class="coin-sym">${c.s}</span><span class="coin-rank">#${c.rank}</span></div>
                <div class="coin-price ${pc}">$${fmtPrice(c.p)}</div>
                <div class="coin-change ${c.c>=0?'up':'down'}">${c.c>=0?'▲ +':'▼ '}${c.c.toFixed(2)}%</div>
                <div class="coin-vol">VOL: ${fmtVol(c.q)}</div>
                <div class="pop-bar"><div class="pop-fill" style="width:${pop}%"></div></div>
            </div>`;
        }

        function updatePrices() {
            let q = document.getElementById('searchInput')?.value || '';
            let coins = q ? allCoins.filter(c => c.s.toLowerCase().includes(q.toLowerCase())) : allCoins;
            document.getElementById('gainersGrid').innerHTML = [...coins].sort((a,b)=>b.c-a.c).slice(0,6).map(coinHTML).join('');
            document.getElementById('losersGrid').innerHTML = [...coins].sort((a,b)=>a.c-b.c).slice(0,6).map(coinHTML).join('');
            document.getElementById('popularGrid').innerHTML = [...coins].sort((a,b)=>b.q-a.q).slice(0,20).map(coinHTML).join('');
        }

        function updateMarquee() {
            let top = [...allCoins].sort((a,b)=>Math.abs(b.c)-Math.abs(a.c)).slice(0,15);
            document.getElementById('marquee').innerHTML = top.map(c => 
                `<span class="marquee-item">${c.s} <span class="${c.c>=0?'m-up':'m-down'}">${c.c>=0?'+':''}${c.c.toFixed(2)}%</span></span>`
            ).join(' │ ') + ' │ ' + top.map(c => 
                `<span class="marquee-item">${c.s} <span class="${c.c>=0?'m-up':'m-down'}">${c.c>=0?'+':''}${c.c.toFixed(2)}%</span></span>`
            ).join(' │ ');
        }

        function updatePortfolio() {
            let list = document.getElementById('pfList'), val = document.getElementById('pfValue'), pnl = document.getElementById('pfPnl');
            if (portfolio.length === 0) {
                list.innerHTML = '<div class="empty"><div class="empty-icon">💼</div><p>PORTFOLIO EMPTY</p></div>';
                val.textContent = '$0.00';
                pnl.innerHTML = '<span style="color:#666;">ADD COINS TO START</span>';
                return;
            }
            let ti = 0, tc = 0;
            list.innerHTML = portfolio.map((item, i) => {
                let coin = allCoins.find(c => c.s === item.symbol);
                let cp = coin ? coin.p : 0, ch = coin ? coin.c : 0;
                let inv = item.amount * item.buyPrice, cur = item.amount * cp, p = cur - inv, pp = inv > 0 ? (p/inv)*100 : 0;
                ti += inv; tc += cur;
                return `<div class="pf-item">
                    <div style="display:flex;justify-content:space-between;">
                        <span class="pf-sym">${item.symbol}</span>
                        <span class="pf-delete" onclick="removePf(${i})">✕</span>
                    </div>
                    <div class="pf-info">${item.amount} UNITS • IN: $${fmtPrice(item.buyPrice)} • NOW: $${fmtPrice(cp)}</div>
                    <div class="pf-info">24H: <span class="${ch>=0?'up':'down'}">${ch>=0?'+':''}${ch.toFixed(2)}%</span></div>
                    <div class="pf-pnl-line ${p>=0?'up':'down'}">P/L: $${p.toFixed(2)} (${pp.toFixed(2)}%)</div>
                </div>`;
            }).join('');
            let tp = tc - ti, tpp = ti > 0 ? (tp/ti)*100 : 0;
            val.textContent = '$' + fmtPrice(tc);
            pnl.innerHTML = `<span class="${tp>=0?'up':'down'}">P/L: $${tp.toFixed(2)} (${tpp.toFixed(2)}%)</span>`;
        }

        function updateFavorites() {
            let favs = allCoins.filter(c => favorites.includes(c.s));
            document.getElementById('favGrid').innerHTML = favs.length > 0 ? favs.map(coinHTML).join('') : '<div class="empty" style="grid-column:1/-1;"><div class="empty-icon">⭐</div><p>NO FAVORITES</p></div>';
        }

        function updateAlerts() {
            let list = document.getElementById('alertList');
            if (alerts.length === 0) {
                list.innerHTML = '<div class="empty"><div class="empty-icon">🔔</div><p>NO ACTIVE ALERTS</p></div>';
                return;
            }
            list.innerHTML = alerts.map((a,i) => {
                let coin = allCoins.find(c => c.s === a.symbol);
                return `<div class="alert-item">
                    <div><strong>${a.symbol}</strong> <span class="alert-badge ${a.dir==='above'?'badge-above':'badge-below'}">${a.dir==='above'?'▲ ABOVE':'▼ BELOW'} $${fmtPrice(a.price)}</span>
                    <div style="font-size:10px;color:#666;margin-top:2px;">CURRENT: ${coin?'$'+fmtPrice(coin.p):'?'}</div></div>
                    <span style="color:var(--neon4);cursor:pointer;" onclick="removeAlert(${i})">✕</span>
                </div>`;
            }).join('');
        }

        function updateProfile() {
            let user = tg.initDataUnsafe?.user || {};
            document.getElementById('profName').textContent = user.first_name || 'USER';
            document.getElementById('profUsername').textContent = user.username ? '@' + user.username : 'ANONYMOUS';
            document.getElementById('profId').textContent = 'ID: ' + (user.id || '-----');
            document.getElementById('statPortfolio').textContent = portfolio.length;
            document.getElementById('statFavorites').textContent = favorites.length;
            document.getElementById('statAlerts').textContent = alerts.length;
            let ti = 0, tc = 0;
            portfolio.forEach(item => {
                let coin = allCoins.find(c => c.s === item.symbol);
                ti += item.amount * item.buyPrice;
                tc += item.amount * (coin ? coin.p : 0);
            });
            document.getElementById('statInvested').textContent = '$' + fmtPrice(ti);
            document.getElementById('statCurrent').textContent = '$' + fmtPrice(tc);
            let tp = tc - ti;
            document.getElementById('statPnl').textContent = (tp>=0?'+':'') + '$' + fmtPrice(Math.abs(tp));
            document.getElementById('statPnl').style.color = tp>=0?'var(--neon3)':'var(--neon4)';
        }

        function resetAll() {
            if (confirm('RESET ALL DATA?')) {
                portfolio = []; favorites = []; alerts = [];
                localStorage.clear();
                updateAll();
                toast('DATA RESET');
            }
        }

        function updateBadges() {
            document.getElementById('badgePF').textContent = portfolio.length;
            document.getElementById('badgeFav').textContent = favorites.length;
            document.getElementById('badgeAlerts').textContent = alerts.length;
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById('tab-' + tab).classList.add('active');
            document.querySelectorAll('.nav-btn, .bottom-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll(`[data-tab="${tab}"]`).forEach(b => b.classList.add('active'));
        }

        document.querySelectorAll('.nav-btn, .bottom-btn').forEach(btn => {
            btn.addEventListener('click', function() { switchTab(this.dataset.tab); });
        });

        function openModal(sym) {
            currentCoin = sym;
            let c = allCoins.find(x => x.s === sym);
            if (!c) return;
            document.getElementById('modSym').textContent = c.s + ' #' + c.rank;
            document.getElementById('modPrice').textContent = '$' + fmtPrice(c.p);
            document.getElementById('modChange').textContent = (c.c>=0?'+':'') + c.c.toFixed(2) + '%';
            document.getElementById('modChange').style.color = c.c>=0?'var(--neon3)':'var(--neon4)';
            document.getElementById('modHigh').textContent = '$' + fmtPrice(c.h);
            document.getElementById('modLow').textContent = '$' + fmtPrice(c.l);
            document.getElementById('modVolume').textContent = fmtVol(c.q);
            document.getElementById('modFavBtn').textContent = favorites.includes(sym) ? '[ UNFAVORITE ]' : '[ + FAVORITE ]';
            document.getElementById('coinModal').classList.add('active');
        }

        function closeModal() { document.getElementById('coinModal').classList.remove('active'); }

        function toggleFav(sym) {
            let i = favorites.indexOf(sym);
            if (i >= 0) { favorites.splice(i,1); toast('REMOVED FROM FAV'); }
            else { favorites.push(sym); toast('ADDED TO FAV'); }
            localStorage.setItem('neon_fav', JSON.stringify(favorites));
            updateAll();
        }

        function toggleFavModal() { toggleFav(currentCoin); }

        function addToPortfolio() {
            let s = prompt('COIN SYMBOL (BTC):'); if (!s) return;
            let a = prompt('AMOUNT:'); if (!a || isNaN(a)) return;
            let p = prompt('BUY PRICE USD:'); if (!p || isNaN(p)) return;
            portfolio.push({symbol:s.toUpperCase(), amount:parseFloat(a), buyPrice:parseFloat(p), date:new Date().toISOString()});
            localStorage.setItem('neon_pf', JSON.stringify(portfolio));
            updateAll(); switchTab('portfolio'); toast('ADDED TO PORTFOLIO');
        }

        function addPfFromModal() {
            let a = prompt(`AMOUNT ${currentCoin}:`,'1'); if (!a) return;
            let c = allCoins.find(x => x.s === currentCoin);
            let p = prompt('BUY PRICE USD:', c ? fmtPrice(c.p) : ''); if (!p) return;
            portfolio.push({symbol:currentCoin, amount:parseFloat(a), buyPrice:parseFloat(p), date:new Date().toISOString()});
            localStorage.setItem('neon_pf', JSON.stringify(portfolio));
            updateAll(); closeModal(); toast('ADDED');
        }

        function removePf(i) { portfolio.splice(i,1); localStorage.setItem('neon_pf', JSON.stringify(portfolio)); updateAll(); toast('REMOVED'); }
        function clearPortfolio() {
            if (portfolio.length === 0) { toast('ALREADY EMPTY'); return; }
            if (confirm('CLEAR ALL?')) { portfolio = []; localStorage.setItem('neon_pf', JSON.stringify(portfolio)); updateAll(); toast('CLEARED'); }
        }

        function addAlert() {
            let s = prompt('COIN SYMBOL:'); if (!s) return;
            let d = confirm('ABOVE price?\nOK = ABOVE\nCancel = BELOW') ? 'above' : 'below';
            let p = prompt('TARGET PRICE USD:'); if (!p || isNaN(p)) return;
            alerts.push({symbol:s.toUpperCase(), dir:d, price:parseFloat(p), date:new Date().toISOString()});
            localStorage.setItem('neon_alerts', JSON.stringify(alerts));
            updateAll(); toast('ALERT CREATED');
        }

        function addAlertFromModal() {
            let d = confirm('ABOVE price?\nOK = ABOVE\nCancel = BELOW') ? 'above' : 'below';
            let c = allCoins.find(x => x.s === currentCoin);
            let p = prompt('TARGET PRICE USD:', c ? fmtPrice(c.p) : ''); if (!p) return;
            alerts.push({symbol:currentCoin, dir:d, price:parseFloat(p), date:new Date().toISOString()});
            localStorage.setItem('neon_alerts', JSON.stringify(alerts));
            updateAll(); closeModal(); toast('ALERT CREATED');
        }

        function removeAlert(i) { alerts.splice(i,1); localStorage.setItem('neon_alerts', JSON.stringify(alerts)); updateAll(); toast('ALERT REMOVED'); }

        function toast(msg) {
            let t = document.getElementById('toast');
            t.textContent = '⚡ ' + msg;
            t.classList.add('show');
            clearTimeout(window._t);
            window._t = setTimeout(() => t.classList.remove('show'), 2000);
        }

        setInterval(() => {
            alerts.forEach((a,i) => {
                let c = allCoins.find(x => x.s === a.symbol);
                if (!c) return;
                if ((a.dir === 'above' && c.p >= a.price) || (a.dir === 'below' && c.p <= a.price)) {
                    alerts.splice(i,1);
                    localStorage.setItem('neon_alerts', JSON.stringify(alerts));
                    updateAll();
                    alert('🚨 ALERT!\n' + a.symbol + ' = $' + fmtPrice(c.p) + '\n' + (a.dir==='above'?'ABOVE':'BELOW') + ' $' + fmtPrice(a.price));
                }
            });
        }, 15000);

        loadData();
        setInterval(loadData, 30000);
    </script>
</body>
  </html>
